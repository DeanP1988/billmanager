<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Bill Manager</title>

  <!-- iOS Safari Standalone Web App Meta Tags -->
  <meta name="apple-mobile-web-app-title" content="Bill Manager" />
  <meta name="application-name" content="Bill Manager" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#08111d" />

  <!-- Apple Touch Icon & Favicon Placeholders (Populated dynamically with High-Res PNG on boot) -->
  <link rel="apple-touch-icon" id="app-apple-icon" sizes="180x180" href="" />
  <link rel="apple-touch-icon-precomposed" id="app-apple-icon-pre" sizes="180x180" href="" />
  <link rel="icon" id="app-favicon" type="image/png" href="" />

  <!-- Dynamic Web App Manifest Link -->
  <link rel="manifest" id="app-manifest-link" href="" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18, ReactDOM, Babel for in-browser standalone execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons Standalone -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .font-mono {
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    /* Prevent iOS Safari from auto-zooming when tapping inputs */
    input, select, textarea {
      font-size: 16px !important;
    }
    /* Hide scrollbar for Chrome, Safari and Opera */
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .safe-bottom {
      padding-bottom: calc(env(safe-area-inset-bottom) + 1.25rem);
    }
  </style>
</head>
<body class="bg-[#000000] text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, createElement } = React;

    // Lightweight Lucide Icon Bridge
    const Icon = ({ name, className = "h-4 w-4", ...props }) => {
      const containerRef = React.useRef(null);
      useEffect(() => {
        if (window.lucide && containerRef.current) {
          containerRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({
            root: containerRef.current
          });
        }
      }, [name, className]);

      return <span ref={containerRef} className="inline-flex items-center justify-center flex-shrink-0" {...props} />;
    };

    // Default Mock Data
    const INITIAL_PROPERTIES = [
      { id: 'prop-1', name: 'Primary Residence', type: 'Home', address: '14 Elmwood Terrace, Suburb', color: 'from-blue-500 to-indigo-600' },
      { id: 'prop-2', name: 'Beachside Rental #1', type: 'Rental', address: '4/28 Ocean Parade, Coastal', color: 'from-cyan-500 to-blue-600' },
      { id: 'prop-3', name: 'Parkside Townhouse #2', type: 'Rental', address: '18 Willow Creek Rd, Hills', color: 'from-emerald-500 to-teal-600' }
    ];

    const CATEGORIES = [
      { name: 'Council Rates', icon: '🏛️', color: 'bg-amber-500/15 text-amber-500 dark:text-amber-400' },
      { name: 'Water & Utilities', icon: '💧', color: 'bg-blue-500/15 text-blue-500 dark:text-blue-400' },
      { name: 'Electricity & Gas', icon: '⚡', color: 'bg-orange-500/15 text-orange-500 dark:text-orange-400' },
      { name: 'Landlord / Home Insurance', icon: '🛡️', color: 'bg-indigo-500/15 text-indigo-500 dark:text-indigo-400' },
      { name: 'Strata / Body Corporate', icon: '🏢', color: 'bg-purple-500/15 text-purple-500 dark:text-purple-400' },
      { name: 'Mortgage & Finance', icon: '💳', color: 'bg-emerald-500/15 text-emerald-500 dark:text-emerald-400' },
      { name: 'Repairs & Maintenance', icon: '🔨', color: 'bg-rose-500/15 text-rose-500 dark:text-rose-400' },
      { name: 'Internet & Tech', icon: '🌐', color: 'bg-cyan-500/15 text-cyan-500 dark:text-cyan-400' },
      { name: 'Other', icon: '📄', color: 'bg-zinc-500/15 text-zinc-500 dark:text-zinc-400' }
    ];

    const getOffsetDate = (days) => {
      const d = new Date();
      d.setDate(d.getDate() + days);
      return d.toISOString().split('T')[0];
    };

    // CURRENT APP VERSION
    const APP_VERSION = "1.2.0";
    const DEFAULT_GITHUB_REPO = "user/bill-manager"; // Format: :owner/:repo

    // RASTER PNG GENERATOR: Converts the high-fidelity 3D artwork to PNG Data URI
    // Safari strictly requires PNG for Apple Touch Icons (it ignores SVG)
    function generateHighResAppleTouchIcon() {
      try {
        const size = 192;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        if (!ctx) return null;

        // Background: Deep dark navy/midnight gradient squircle
        const bgGrad = ctx.createLinearGradient(0, 0, size, size);
        bgGrad.addColorStop(0, '#19324f');
        bgGrad.addColorStop(0.4, '#0e2034');
        bgGrad.addColorStop(1, '#060c16');
        ctx.fillStyle = bgGrad;

        // Draw rounded rectangle
        const r = 44;
        ctx.beginPath();
        ctx.moveTo(r, 0);
        ctx.lineTo(size - r, 0);
        ctx.quadraticCurveTo(size, 0, size, r);
        ctx.lineTo(size, size - r);
        ctx.quadraticCurveTo(size, size, size - r, size);
        ctx.lineTo(r, size);
        ctx.quadraticCurveTo(0, size, 0, size - r);
        ctx.lineTo(0, r);
        ctx.quadraticCurveTo(0, 0, r, 0);
        ctx.closePath();
        ctx.fill();

        // Subtle glowing border
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(125, 211, 252, 0.4)';
        ctx.stroke();

        // Layer 1: Stacked Currency Bills (Gold layer at bottom)
        ctx.fillStyle = '#ca8a04';
        ctx.beginPath();
        ctx.moveTo(34, 110);
        ctx.lineTo(84, 82);
        ctx.lineTo(158, 114);
        ctx.lineTo(108, 142);
        ctx.closePath();
        ctx.fill();

        // Layer 2: Middle Teal Bill
        ctx.fillStyle = '#0f766e';
        ctx.beginPath();
        ctx.moveTo(32, 102);
        ctx.lineTo(82, 74);
        ctx.lineTo(156, 106);
        ctx.lineTo(106, 134);
        ctx.closePath();
        ctx.fill();

        // Layer 3: Top Blue Bill
        const billGrad = ctx.createLinearGradient(30, 68, 154, 128);
        billGrad.addColorStop(0, '#38bdf8');
        billGrad.addColorStop(0.5, '#0284c7');
        billGrad.addColorStop(1, '#0369a1');
        ctx.fillStyle = billGrad;
        ctx.beginPath();
        ctx.moveTo(30, 94);
        ctx.lineTo(80, 66);
        ctx.lineTo(154, 98);
        ctx.lineTo(104, 126);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Golden Dollar Seal on Top Bill
        ctx.save();
        ctx.translate(92, 96);
        ctx.scale(1, 0.58);
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.fillStyle = '#0284c7';
        ctx.fill();
        ctx.strokeStyle = '#fef08a';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = '#fef08a';
        ctx.font = 'bold 19px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('$', 92, 97);

        // Frosted Glass Calendar Widget (Lower Right)
        const calX = 94;
        const calY = 96;
        const calW = 68;
        const calH = 58;
        const calR = 14;

        ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
        ctx.beginPath();
        ctx.moveTo(calX + calR, calY);
        ctx.lineTo(calX + calW - calR, calY);
        ctx.quadraticCurveTo(calX + calW, calY, calX + calW, calY + calR);
        ctx.lineTo(calX + calW, calY + calH - calR);
        ctx.quadraticCurveTo(calX + calW, calY + calH, calX + calW - calR, calY + calH);
        ctx.lineTo(calX + calR, calY + calH);
        ctx.quadraticCurveTo(calX, calY + calH, calX, calY + calH - calR);
        ctx.lineTo(calX, calY + calR);
        ctx.quadraticCurveTo(calX, calY, calX + calR, calY);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Calendar Rings
        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(calX + 14, calY - 4, 6, 10);
        ctx.fillRect(calX + calW - 20, calY - 4, 6, 10);

        // Calendar Grid Dots
        const dots = [
          [calX + 18, calY + 24], [calX + 34, calY + 24], [calX + 50, calY + 24],
          [calX + 18, calY + 40], [calX + 34, calY + 40]
        ];
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        dots.forEach(([dx, dy]) => {
          ctx.beginPath();
          ctx.arc(dx, dy, 3.2, 0, Math.PI * 2);
          ctx.fill();
        });

        // Golden Highlight Date Dot
        ctx.beginPath();
        ctx.arc(calX + 50, calY + 40, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = '#eab308';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Verified Checkmark Shield (Top Right)
        const chkGrad = ctx.createLinearGradient(115, 40, 155, 80);
        chkGrad.addColorStop(0, '#34d399');
        chkGrad.addColorStop(1, '#059669');
        ctx.fillStyle = chkGrad;
        ctx.beginPath();
        ctx.arc(132, 58, 22, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // White Checkmark
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(122, 59);
        ctx.lineTo(129, 66);
        ctx.lineTo(143, 50);
        ctx.stroke();

        // Notification Badge ("1") in Gold (Top Edge)
        const bX = 160;
        const bY = 36;
        ctx.beginPath();
        ctx.arc(bX, bY, 16, 0, Math.PI * 2);
        const badgeGrad = ctx.createLinearGradient(bX - 16, bY - 16, bX + 16, bY + 16);
        badgeGrad.addColorStop(0, '#fde047');
        badgeGrad.addColorStop(1, '#ca8a04');
        ctx.fillStyle = badgeGrad;
        ctx.fill();
        ctx.strokeStyle = '#08111d';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = '#451a03';
        ctx.font = 'bold 16px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('1', bX, bY + 1);

        return canvas.toDataURL('image/png');
      } catch (e) {
        console.error("Canvas icon generation failed:", e);
        return null;
      }
    }

    // CLEAN LEDGER: Start with clean slate for the user's real household and rental property bills
    const INITIAL_BILLS = [];

    function App() {
      const [isDarkMode, setIsDarkMode] = useState(true);

      const [bills, setBills] = useState(() => {
        try {
          // Check for freshly cleared session flag to avoid loading previous mock bills
          const isFreshStart = localStorage.getItem('ios_bills_cleared_v1');
          if (!isFreshStart) {
            localStorage.removeItem('ios_bills_html_data');
            localStorage.setItem('ios_bills_cleared_v1', 'true');
            return INITIAL_BILLS;
          }
          const saved = localStorage.getItem('ios_bills_html_data');
          return saved ? JSON.parse(saved) : INITIAL_BILLS;
        } catch {
          return INITIAL_BILLS;
        }
      });

      const [properties, setProperties] = useState(() => {
        try {
          const saved = localStorage.getItem('ios_properties_html_data');
          return saved ? JSON.parse(saved) : INITIAL_PROPERTIES;
        } catch {
          return INITIAL_PROPERTIES;
        }
      });

      const [activeTab, setActiveTab] = useState('dashboard');
      const [selectedPropertyFilter, setSelectedPropertyFilter] = useState('ALL');
      const [statusFilter, setStatusFilter] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');

      const [isAddBillOpen, setIsAddBillOpen] = useState(false);
      const [editingBill, setEditingBill] = useState(null);
      const [isAddPropOpen, setIsAddPropOpen] = useState(false);
      const [editingProp, setEditingProp] = useState(null);
      const [propertyToDelete, setPropertyToDelete] = useState(null);
      const [reassignTargetPropId, setReassignTargetPropId] = useState('');
      const [viewingDetailBill, setViewingDetailBill] = useState(null);
      const [isNotificationSheetOpen, setIsNotificationSheetOpen] = useState(false);
      const [notificationPermission, setNotificationPermission] = useState('default');
      const [mockBannerNotification, setMockBannerNotification] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);

      // --- AUTO-UPDATE & GITHUB RELEASE ENGINE STATE ---
      const [isUpdateModalOpen, setIsUpdateModalOpen] = useState(false);
      const [isCheckingUpdate, setIsCheckingUpdate] = useState(false);
      const [availableUpdate, setAvailableUpdate] = useState(null); // { version, changelog, date, downloadUrl }
      const [isUpdateSettingsOpen, setIsUpdateSettingsOpen] = useState(false);
      const [githubRepoConfig, setGithubRepoConfig] = useState(() => {
        try {
          return localStorage.getItem('ios_update_github_repo') || DEFAULT_GITHUB_REPO;
        } catch {
          return DEFAULT_GITHUB_REPO;
        }
      });

      // Check Notification API permission status on mount
      useEffect(() => {
        if ('Notification' in window) {
          setNotificationPermission(Notification.permission);
        }

        // CRITICAL FIX FOR SAFARI: Generate real PNG Data URI for Apple Touch Icon
        const pngIconUrl = generateHighResAppleTouchIcon();
        if (pngIconUrl) {
          // Set Apple Touch Icon links
          const appleIcon = document.getElementById('app-apple-icon');
          if (appleIcon) appleIcon.setAttribute('href', pngIconUrl);

          const appleIconPre = document.getElementById('app-apple-icon-pre');
          if (appleIconPre) appleIconPre.setAttribute('href', pngIconUrl);

          const favIcon = document.getElementById('app-favicon');
          if (favIcon) favIcon.setAttribute('href', pngIconUrl);

          // Dynamically create or update PWA manifest with real PNG icon data
          const manifestObj = {
            name: "Bill Manager",
            short_name: "Bill Manager",
            start_url: ".",
            display: "standalone",
            background_color: "#000000",
            theme_color: "#000000",
            icons: [
              {
                src: pngIconUrl,
                sizes: "192x192",
                type: "image/png",
                purpose: "any maskable"
              }
            ]
          };
          const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
          const manifestUrl = URL.createObjectURL(manifestBlob);
          const manifestLink = document.getElementById('app-manifest-link');
          if (manifestLink) manifestLink.setAttribute('href', manifestUrl);
        }
      }, []);

      const [billForm, setBillForm] = useState({
        name: '',
        propertyId: 'prop-1',
        amount: '',
        category: 'Council Rates',
        dueDate: getOffsetDate(7),
        issueDate: new Date().toISOString().split('T')[0],
        sourceRef: '',
        bpayCode: '',
        recurrence: 'Quarterly',
        notes: '',
        status: 'Pending'
      });

      const [propForm, setPropForm] = useState({
        name: '',
        type: 'Rental',
        address: '',
        color: 'from-blue-500 to-indigo-600',
        defaultEmailRef: ''
      });

      useEffect(() => {
        try {
          localStorage.setItem('ios_bills_html_data', JSON.stringify(bills));
        } catch (e) {
          console.error(e);
        }
      }, [bills]);

      useEffect(() => {
        try {
          localStorage.setItem('ios_properties_html_data', JSON.stringify(properties));
        } catch (e) {
          console.error(e);
        }
      }, [properties]);

      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 2800);
      };

      const copyToClipboard = (text) => {
        const input = document.createElement('textarea');
        input.value = text;
        document.body.appendChild(input);
        input.select();
        try {
          document.execCommand('copy');
          triggerToast("Copied to clipboard!");
        } catch (err) {
          console.error(err);
        }
        document.body.removeChild(input);
      };

      const getDaysDiff = (targetDateStr) => {
        if (!targetDateStr) return 0;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const target = new Date(targetDateStr);
        target.setHours(0, 0, 0, 0);
        const diff = target.getTime() - today.getTime();
        return Math.ceil(diff / (1000 * 60 * 60 * 24));
      };

      // --- BILL NOTIFICATION ENGINE (5d, 3d, 1d, and daily overdue) ---
      const triggerSystemNotification = (title, body, tag) => {
        // 1. Try Native System Notification
        if ('Notification' in window && Notification.permission === 'granted') {
          try {
            new Notification(title, {
              body,
              icon: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%230284c7'/%3E%3Ctext x='50' y='65' font-size='50' fill='white' text-anchor='middle' font-weight='bold'%3E$%3C/text%3E%3C/svg%3E",
              tag: tag || 'bill-alert',
              badge: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%230284c7'/%3E%3C/svg%3E"
            });
          } catch (e) {
            console.warn("Native notification dispatch error:", e);
          }
        }

        // 2. Always show high-fidelity in-app iOS Banner for visible feedback
        setMockBannerNotification({ title, body, time: 'Just now' });
        setTimeout(() => {
          setMockBannerNotification(null);
        }, 5500);
      };

      const checkAndDispatchDueNotifications = (manual = false) => {
        const todayStr = new Date().toISOString().split('T')[0];
        const logKey = `bill_notif_log_${todayStr}`;
        let sentLog = {};
        try {
          sentLog = JSON.parse(localStorage.getItem(logKey) || '{}');
        } catch {}

        let notificationsDispatched = 0;

        bills.forEach(bill => {
          if (bill.status === 'Paid') return; // Settle bills stop all notifications immediately
          const daysLeft = getDaysDiff(bill.dueDate);
          const prop = properties.find(p => p.id === bill.propertyId);
          const propName = prop ? prop.name : 'Your Property';

          let shouldNotify = false;
          let notifTitle = '';
          let notifBody = '';
          const tag = `bill-${bill.id}-${todayStr}`;

          // Avoid duplicate alerts on the same calendar day for the same bill
          if (!manual && sentLog[tag]) return;

          if (daysLeft === 5) {
            shouldNotify = true;
            notifTitle = `Bill Due in 5 Days: ${bill.name}`;
            notifBody = `${fmt(bill.amount)} for ${propName} is due on ${bill.dueDate}. Keep funds in offset.`;
          } else if (daysLeft === 3) {
            shouldNotify = true;
            notifTitle = `⚡ Action: ${bill.name} Due in 3 Days`;
            notifBody = `${fmt(bill.amount)} due on ${bill.dueDate}. Optimal pay day is tomorrow!`;
          } else if (daysLeft === 1) {
            shouldNotify = true;
            notifTitle = `🚨 Due Tomorrow: ${bill.name}`;
            notifBody = `Pay ${fmt(bill.amount)} today before 5pm to ensure transfer clears on time.`;
          } else if (daysLeft === 0) {
            shouldNotify = true;
            notifTitle = `⚠️ Due Today: ${bill.name}`;
            notifBody = `${fmt(bill.amount)} for ${propName} is due today! Settle now to avoid late fees.`;
          } else if (daysLeft < 0) {
            // Overdue: fires EVERY single day until bill is marked Paid
            shouldNotify = true;
            const overdueDays = Math.abs(daysLeft);
            notifTitle = `🔴 OVERDUE (${overdueDays}d): ${bill.name}`;
            notifBody = `${fmt(bill.amount)} for ${propName} is past due! Mark as paid once settled.`;
          }

          if (shouldNotify) {
            triggerSystemNotification(notifTitle, notifBody, tag);
            sentLog[tag] = true;
            notificationsDispatched++;
          }
        });

        try {
          localStorage.setItem(logKey, JSON.stringify(sentLog));
        } catch {}

        if (manual && notificationsDispatched === 0) {
          triggerToast("All upcoming bills are on schedule!");
        }
      };

      // Check on app load
      useEffect(() => {
        const timer = setTimeout(() => {
          checkAndDispatchDueNotifications(false);
        }, 1200);
        return () => clearTimeout(timer);
      }, [bills]);

      // --- COLD START AUTO-UPDATE ENGINE (GITHUB) ---
      // Runs on genuine cold start (or when reopening app after 20+ minutes)
      useEffect(() => {
        const now = Date.now();
        const lastBoot = parseInt(localStorage.getItem('app_last_boot_ts') || '0', 10);
        const sessionChecked = sessionStorage.getItem('app_cold_boot_update_checked');

        // Cold boot triggers if:
        // 1. Session is completely fresh (tab or app reopened)
        // 2. Or background elapsed time > 20 minutes (1,200,000 ms)
        const isColdBoot = !sessionChecked || (now - lastBoot > 1200000);

        if (isColdBoot) {
          sessionStorage.setItem('app_cold_boot_update_checked', 'true');
          localStorage.setItem('app_last_boot_ts', now.toString());

          const checkTimer = setTimeout(() => {
            checkForAppUpdate(false);
          }, 1500);

          return () => clearTimeout(checkTimer);
        }
      }, []);

      const checkForAppUpdate = async (isManual = false) => {
        setIsCheckingUpdate(true);
        if (isManual) {
          triggerToast("Checking GitHub for updates...");
        }

        try {
          // Resolve GitHub repository: either user-configured or auto-detected from GitHub Pages URL
          let cleanRepo = (githubRepoConfig || '').trim();
          
          // Auto-detect owner/repo if hosted on github.io
          if (!cleanRepo || cleanRepo === DEFAULT_GITHUB_REPO) {
            const hostParts = window.location.hostname.split('.');
            if (hostParts.length >= 3 && hostParts[1] === 'github' && hostParts[2] === 'io') {
              const owner = hostParts[0];
              const pathSegments = window.location.pathname.split('/').filter(Boolean);
              const repo = pathSegments[0] || 'bill-manager';
              cleanRepo = `${owner}/${repo}`;
              setGithubRepoConfig(cleanRepo);
              localStorage.setItem('ios_update_github_repo', cleanRepo);
            }
          }

          cleanRepo = cleanRepo.replace(/^https?:\/\/github\.com\//i, '').replace(/\/$/, '');

          if (!cleanRepo || cleanRepo === DEFAULT_GITHUB_REPO) {
            if (isManual) {
              triggerToast("Please set your GitHub repository in Settings");
              setIsUpdateSettingsOpen(true);
            }
            setIsCheckingUpdate(false);
            return;
          }

          // 1. Check Releases API for latest published tag
          const apiUrl = `https://api.github.com/repos/${cleanRepo}/releases/latest`;
          const response = await fetch(apiUrl, {
            headers: { 'Accept': 'application/vnd.github.v3+json' }
          });

          if (response.ok) {
            const data = await response.json();
            const remoteVersion = (data.tag_name || data.name || '').replace(/^v/i, '').trim();

            if (remoteVersion && remoteVersion !== APP_VERSION) {
              setAvailableUpdate({
                version: remoteVersion,
                currentVersion: APP_VERSION,
                changelog: data.body || 'New features, cash flow enhancements, and stability improvements.',
                date: data.published_at ? new Date(data.published_at).toLocaleDateString() : 'Recent',
                htmlUrl: data.html_url
              });
              setIsUpdateModalOpen(true);
              return;
            }
          }

          // 2. Fallback: Check Commits API if repository uses direct commit pushes
          const commitsUrl = `https://api.github.com/repos/${cleanRepo}/commits?per_page=1`;
          const commitRes = await fetch(commitsUrl, {
            headers: { 'Accept': 'application/vnd.github.v3+json' }
          });

          if (commitRes.ok) {
            const commits = await commitRes.json();
            if (commits && commits.length > 0) {
              const latestSha = commits[0].sha.substring(0, 7);
              const localSha = localStorage.getItem('app_installed_commit_sha');

              // If there's an existing registered commit SHA and it differs, trigger update prompt
              if (localSha && localSha !== latestSha) {
                setAvailableUpdate({
                  version: `Commit #${latestSha}`,
                  currentVersion: `Commit #${localSha}`,
                  changelog: commits[0].commit?.message || 'New updates available on repository.',
                  date: new Date(commits[0].commit?.author?.date).toLocaleDateString(),
                  htmlUrl: commits[0].html_url
                });
                setIsUpdateModalOpen(true);
                return;
              } else if (!localSha) {
                // Seed local commit tracking on initial fetch
                localStorage.setItem('app_installed_commit_sha', latestSha);
              }
            }
          }

          if (isManual) {
            triggerToast(`App is up to date (v${APP_VERSION})`);
          }
        } catch (err) {
          console.warn("Update check failed:", err);
          if (isManual) {
            triggerToast("GitHub check timed out. Verify repo settings.");
          }
        } finally {
          setIsCheckingUpdate(false);
        }
      };

      // Deploy the update with ZERO data loss
      const handleDeployUpdate = async () => {
        triggerToast("Deploying update safely...");

        try {
          // 1. Data Preservation: Snapshot current data in localStorage with backup keys
          const billsData = localStorage.getItem('ios_bills_html_data');
          const propsData = localStorage.getItem('ios_properties_html_data');
          if (billsData) localStorage.setItem('ios_bills_html_data_backup', billsData);
          if (propsData) localStorage.setItem('ios_properties_html_data_backup', propsData);

          // 2. Clear out old service worker caches if applicable
          if ('caches' in window) {
            const cacheKeys = await caches.keys();
            await Promise.all(cacheKeys.map(key => caches.delete(key)));
          }

          // 3. Mark the new version or commit as current
          if (availableUpdate?.version?.startsWith('Build #')) {
            const newSha = availableUpdate.version.replace('Build #', '');
            localStorage.setItem('app_installed_commit_sha', newSha);
          }

          setIsUpdateModalOpen(false);

          // 4. Force reload from server, bypassing browser cache
          setTimeout(() => {
            window.location.reload(true);
          }, 800);
        } catch (e) {
          console.error("Update deployment error:", e);
          window.location.reload(true);
        }
      };

      const requestNotificationPermission = async () => {
        if (!('Notification' in window)) {
          triggerToast("Notifications are not supported in this browser");
          return;
        }

        try {
          const perm = await Notification.requestPermission();
          setNotificationPermission(perm);
          if (perm === 'granted') {
            triggerToast("✓ Notifications Enabled!");
            triggerSystemNotification(
              "🔔 Bill Reminders Active",
              "You will now get alerts 5d, 3d, 1d before due dates, and daily while overdue.",
              "setup-confirmed"
            );
          } else {
            triggerToast("Permission was not granted");
          }
        } catch (e) {
          console.error(e);
          triggerToast("Unable to request permission");
        }
      };

      const getOptimalPayDate = (dueDateStr) => {
        if (!dueDateStr) return 'N/A';
        const d = new Date(dueDateStr);
        d.setDate(d.getDate() - 2);
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      };

      const processedBills = useMemo(() => {
        return bills.map(bill => {
          const days = getDaysDiff(bill.dueDate);
          let calculatedStatus = bill.status;
          if (bill.status !== 'Paid') {
            if (days < 0) calculatedStatus = 'Overdue';
            else if (days <= 3) calculatedStatus = 'Due Soon';
            else calculatedStatus = 'Upcoming';
          }
          return {
            ...bill,
            daysLeft: days,
            computedStatus: calculatedStatus
          };
        });
      }, [bills]);

      const metrics = useMemo(() => {
        let overdueTotal = 0;
        let overdueCount = 0;
        let due7DaysTotal = 0;
        let due7DaysCount = 0;
        let totalPending = 0;
        let paidThisMonth = 0;

        const curMonth = new Date().getMonth();
        const curYear = new Date().getFullYear();

        processedBills.forEach(b => {
          if (selectedPropertyFilter !== 'ALL' && b.propertyId !== selectedPropertyFilter) return;

          const amt = Number(b.amount) || 0;
          if (b.status === 'Paid') {
            const pDate = new Date(b.paidDate || b.dueDate);
            if (pDate.getMonth() === curMonth && pDate.getFullYear() === curYear) {
              paidThisMonth += amt;
            }
          } else {
            totalPending += amt;
            if (b.daysLeft < 0) {
              overdueTotal += amt;
              overdueCount++;
            }
            if (b.daysLeft >= 0 && b.daysLeft <= 7) {
              due7DaysTotal += amt;
              due7DaysCount++;
            }
          }
        });

        return {
          overdueTotal,
          overdueCount,
          due7DaysTotal,
          due7DaysCount,
          totalPending,
          paidThisMonth
        };
      }, [processedBills, selectedPropertyFilter]);

      const urgentBills = useMemo(() => {
        return processedBills
          .filter(b => b.status !== 'Paid' && b.daysLeft <= 3)
          .sort((a, b) => a.daysLeft - b.daysLeft);
      }, [processedBills]);

      const filteredBills = useMemo(() => {
        return processedBills.filter(bill => {
          if (selectedPropertyFilter !== 'ALL' && bill.propertyId !== selectedPropertyFilter) {
            return false;
          }
          if (statusFilter === 'PAID' && bill.status !== 'Paid') return false;
          if (statusFilter === 'OVERDUE' && (bill.status === 'Paid' || bill.daysLeft >= 0)) return false;
          if (statusFilter === 'DUE_SOON' && (bill.status === 'Paid' || bill.daysLeft < 0 || bill.daysLeft > 7)) return false;
          if (statusFilter === 'PENDING' && bill.status === 'Paid') return false;

          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const prop = properties.find(p => p.id === bill.propertyId);
            const match = 
              bill.name.toLowerCase().includes(q) ||
              bill.category.toLowerCase().includes(q) ||
              (bill.sourceRef && bill.sourceRef.toLowerCase().includes(q)) ||
              (bill.notes && bill.notes.toLowerCase().includes(q)) ||
              (bill.bpayCode && bill.bpayCode.toLowerCase().includes(q)) ||
              (prop && prop.name.toLowerCase().includes(q));
            if (!match) return false;
          }
          return true;
        }).sort((a, b) => {
          if (a.status === 'Paid' && b.status !== 'Paid') return 1;
          if (a.status !== 'Paid' && b.status === 'Paid') return -1;
          return new Date(a.dueDate) - new Date(b.dueDate);
        });
      }, [processedBills, selectedPropertyFilter, statusFilter, searchQuery, properties]);

      const togglePaid = (bill, e) => {
        e?.stopPropagation();
        const willBePaid = bill.status !== 'Paid';
        const updated = bills.map(b => {
          if (b.id === bill.id) {
            return {
              ...b,
              status: willBePaid ? 'Paid' : 'Pending',
              paidDate: willBePaid ? new Date().toISOString().split('T')[0] : null
            };
          }
          return b;
        });
        setBills(updated);
        triggerToast(willBePaid ? `✓ Marked "${bill.name}" as Paid` : `Marked as Pending`);
        if (viewingDetailBill?.id === bill.id) {
          setViewingDetailBill(prev => ({
            ...prev,
            status: willBePaid ? 'Paid' : 'Pending',
            paidDate: willBePaid ? new Date().toISOString().split('T')[0] : null
          }));
        }
      };

      const deleteBill = (id) => {
        setBills(prev => prev.filter(b => b.id !== id));
        setViewingDetailBill(null);
        triggerToast("Bill deleted");
      };

      const openAddBillModal = () => {
        setEditingBill(null);
        setBillForm({
          name: '',
          propertyId: properties[0]?.id || 'prop-1',
          amount: '',
          category: 'Council Rates',
          dueDate: getOffsetDate(7),
          issueDate: new Date().toISOString().split('T')[0],
          sourceRef: '',
          bpayCode: '',
          recurrence: 'Quarterly',
          notes: '',
          status: 'Pending'
        });
        setIsAddBillOpen(true);
      };

      const openEditBillModal = (bill) => {
        setEditingBill(bill);
        setBillForm({
          name: bill.name,
          propertyId: bill.propertyId,
          amount: bill.amount,
          category: bill.category,
          dueDate: bill.dueDate,
          issueDate: bill.issueDate || '',
          sourceRef: bill.sourceRef || '',
          bpayCode: bill.bpayCode || '',
          recurrence: bill.recurrence || 'Quarterly',
          notes: bill.notes || '',
          status: bill.status
        });
        setViewingDetailBill(null);
        setIsAddBillOpen(true);
      };

      const handleSaveBill = (e) => {
        e.preventDefault();
        if (!billForm.name.trim() || !billForm.amount) return;

        if (editingBill) {
          setBills(prev => prev.map(b => b.id === editingBill.id ? {
            ...b,
            ...billForm,
            amount: parseFloat(billForm.amount) || 0
          } : b));
          triggerToast('Bill updated successfully');
        } else {
          const newBill = {
            id: 'bill-' + Date.now(),
            ...billForm,
            amount: parseFloat(billForm.amount) || 0
          };
          setBills(prev => [newBill, ...prev]);
          triggerToast('Added new bill to cash flow');
        }
        setIsAddBillOpen(false);
      };

      const openAddPropertyModal = () => {
        setEditingProp(null);
        setPropForm({
          name: '',
          type: 'Rental',
          address: '',
          color: 'from-blue-500 to-indigo-600',
          defaultEmailRef: ''
        });
        setIsAddPropOpen(true);
      };

      const openEditPropertyModal = (prop, e) => {
        e?.stopPropagation();
        setEditingProp(prop);
        setPropForm({
          name: prop.name,
          type: prop.type,
          address: prop.address || '',
          color: prop.color || 'from-blue-500 to-indigo-600',
          defaultEmailRef: prop.defaultEmailRef || ''
        });
        setIsAddPropOpen(true);
      };

      const handleSaveProperty = (e) => {
        e.preventDefault();
        if (!propForm.name.trim()) return;

        if (editingProp) {
          setProperties(prev => prev.map(p => p.id === editingProp.id ? {
            ...p,
            name: propForm.name.trim(),
            type: propForm.type,
            address: propForm.address.trim(),
            color: propForm.color,
            defaultEmailRef: propForm.defaultEmailRef.trim()
          } : p));
          triggerToast(`Updated "${propForm.name.trim()}"`);
        } else {
          const colors = [
            'from-blue-500 to-indigo-600',
            'from-cyan-500 to-blue-600',
            'from-emerald-500 to-teal-600',
            'from-purple-500 to-pink-600',
            'from-amber-500 to-orange-600'
          ];
          const newProp = {
            id: 'prop-' + Date.now(),
            name: propForm.name.trim(),
            type: propForm.type,
            address: propForm.address.trim(),
            color: propForm.color || colors[properties.length % colors.length],
            defaultEmailRef: propForm.defaultEmailRef.trim()
          };
          setProperties(prev => [...prev, newProp]);
          triggerToast(`Added property "${newProp.name}"`);
        }
        setIsAddPropOpen(false);
      };

      const promptDeleteProperty = (prop, e) => {
        e?.stopPropagation();
        const otherProps = properties.filter(p => p.id !== prop.id);
        setReassignTargetPropId(otherProps[0]?.id || '');
        setPropertyToDelete(prop);
      };

      const confirmDeleteProperty = (actionType) => {
        if (!propertyToDelete) return;
        const propId = propertyToDelete.id;

        if (actionType === 'delete_all') {
          setBills(prev => prev.filter(b => b.propertyId !== propId));
          setProperties(prev => prev.filter(p => p.id !== propId));
          triggerToast(`Deleted property and associated bills`);
        } else if (actionType === 'reassign' && reassignTargetPropId) {
          const target = properties.find(p => p.id === reassignTargetPropId);
          setBills(prev => prev.map(b => b.propertyId === propId ? { ...b, propertyId: reassignTargetPropId } : b));
          setProperties(prev => prev.filter(p => p.id !== propId));
          triggerToast(`Property removed. Bills reassigned to ${target?.name || 'new property'}`);
        } else {
          setProperties(prev => prev.filter(p => p.id !== propId));
          setBills(prev => prev.filter(b => b.propertyId !== propId));
          triggerToast(`Deleted "${propertyToDelete.name}"`);
        }

        if (selectedPropertyFilter === propId) {
          setSelectedPropertyFilter('ALL');
        }
        setPropertyToDelete(null);
      };

      const fmt = (val) => {
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'USD',
          minimumFractionDigits: 2
        }).format(val || 0);
      };

      const getCategoryDetails = (catName) => {
        return CATEGORIES.find(c => c.name === catName) || {
          name: catName,
          icon: '📄',
          color: 'bg-zinc-500/15 text-zinc-400'
        };
      };

      const propertyOutflow = useMemo(() => {
        return properties.map(p => {
          const pBills = bills.filter(b => b.propertyId === p.id);
          const pendingBills = pBills.filter(b => b.status !== 'Paid');
          const pending = pendingBills.reduce((s, b) => s + Number(b.amount), 0);
          const paid = pBills.filter(b => b.status === 'Paid').reduce((s, b) => s + Number(b.amount), 0);
          const hasOverdue = pendingBills.some(b => getDaysDiff(b.dueDate) < 0);
          const nextDueBill = pendingBills.sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate))[0] || null;

          return {
            ...p,
            pending,
            paid,
            total: pending + paid,
            count: pBills.length,
            pendingCount: pendingBills.length,
            hasOverdue,
            nextDueBill
          };
        });
      }, [bills, properties]);

      const activePropertyData = useMemo(() => {
        if (selectedPropertyFilter === 'ALL') return null;
        return propertyOutflow.find(p => p.id === selectedPropertyFilter) || null;
      }, [selectedPropertyFilter, propertyOutflow]);

      return (
        <div className={`min-h-screen transition-colors duration-300 ${
          isDarkMode ? 'bg-[#000000] text-slate-100' : 'bg-[#F2F2F7] text-zinc-900'
        } flex flex-col items-center justify-start p-0 selection:bg-blue-500 selection:text-white`}>

          {/* iOS Live Notification Banner Dropdown Simulator */}
          {mockBannerNotification && (
            <div 
              onClick={() => setMockBannerNotification(null)}
              className="fixed top-3 left-3 right-3 max-w-md mx-auto z-50 animate-in slide-in-from-top-6 duration-300 cursor-pointer"
            >
              <div className={`p-3 rounded-[24px] shadow-2xl border backdrop-blur-2xl flex items-start gap-3 ${
                isDarkMode 
                  ? 'bg-[#1C1C1E]/95 border-white/10 text-white' 
                  : 'bg-white/95 border-black/10 text-zinc-900 shadow-xl'
              }`}>
                {/* App Icon matching Home Screen */}
                <div className="w-10 h-10 rounded-xl overflow-hidden flex-shrink-0 shadow-sm border border-white/10">
                  <img src={APP_HOME_ICON_SVG} alt="Bill Manager" className="w-full h-full object-cover" />
                </div>
                <div className="flex-1 min-w-0 pr-1">
                  <div className="flex items-center justify-between text-[11px] text-zinc-400 mb-0.5">
                    <span className="font-semibold uppercase tracking-wider text-[10px]">BILL MANAGER</span>
                    <span>{mockBannerNotification.time}</span>
                  </div>
                  <h4 className="text-xs font-bold truncate leading-snug">{mockBannerNotification.title}</h4>
                  <p className="text-[11px] text-zinc-300 line-clamp-2 leading-tight mt-0.5">{mockBannerNotification.body}</p>
                </div>
              </div>
            </div>
          )}

          {/* Main Viewport Container - Direct Native iPhone-optimized Layout (No Phone Bezel/Outline) */}
          <div className="w-full max-w-lg min-h-screen flex flex-col relative px-4 pb-28 pt-2">

            {/* Header & Quick Action Pills */}
            <header className="w-full flex items-center justify-between pt-2 pb-3 mb-1">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-xl overflow-hidden shadow-sm border border-white/10 flex-shrink-0 bg-blue-900/30">
                  <canvas id="header-icon-canvas" width="32" height="32" ref={canvas => {
                    if (canvas && !canvas.dataset.rendered) {
                      canvas.dataset.rendered = "true";
                      const ctx = canvas.getContext('2d');
                      const img = new Image();
                      img.onload = () => ctx.drawImage(img, 0, 0, 32, 32);
                      const png = generateHighResAppleTouchIcon();
                      if (png) img.src = png;
                    }
                  }} className="w-full h-full object-cover" />
                </div>
                <div>
                  <h1 className={`text-base font-bold tracking-tight leading-tight ${isDarkMode ? 'text-white' : 'text-zinc-900'}`}>
                    Bill Manager
                  </h1>
                  <span className="text-[10px] text-zinc-400 font-medium">Cash Flow & Float</span>
                </div>
              </div>

              <div className="flex items-center gap-1.5">
                <button
                  onClick={() => setIsNotificationSheetOpen(true)}
                  className={`p-2 rounded-full border text-xs transition-all active:scale-95 ${
                    notificationPermission === 'granted'
                      ? isDarkMode 
                        ? 'bg-emerald-500/15 border-emerald-500/30 text-emerald-400' 
                        : 'bg-emerald-50 border-emerald-200 text-emerald-600'
                      : isDarkMode 
                        ? 'bg-amber-500/15 border-amber-500/30 text-amber-400' 
                        : 'bg-amber-50 border-amber-200 text-amber-600'
                  }`}
                  title="Bill Notifications"
                >
                  <Icon name="bell" className="h-4 w-4" />
                </button>

                <button
                  onClick={() => setIsUpdateSettingsOpen(true)}
                  className={`px-2.5 py-1.5 rounded-full border text-[11px] font-mono font-medium transition-all active:scale-95 ${
                    isDarkMode 
                      ? 'bg-zinc-900/90 border-zinc-800 text-zinc-300 hover:text-white' 
                      : 'bg-white border-zinc-200 text-zinc-700 hover:text-black shadow-sm'
                  }`}
                  title="Version & GitHub Updates"
                >
                  v{APP_VERSION}
                </button>

                <button
                  onClick={() => setIsDarkMode(!isDarkMode)}
                  className={`p-2 rounded-full border transition-all active:scale-95 ${
                    isDarkMode 
                      ? 'bg-zinc-900/90 border-zinc-800 text-amber-400 hover:bg-zinc-800' 
                      : 'bg-white border-zinc-200 text-zinc-600 hover:text-zinc-900 shadow-sm'
                  }`}
                  aria-label="Toggle theme"
                >
                  <Icon name={isDarkMode ? "sun" : "moon"} className="h-4 w-4" />
                </button>
              </div>
            </header>

            {/* Toast Feedback */}
            {toastMessage && (
              <div className="fixed top-14 left-1/2 -translate-x-1/2 z-50 transition-all duration-300">
                <div className={`px-4 py-2 rounded-full text-xs font-semibold backdrop-blur-xl shadow-xl flex items-center gap-2 ${
                  isDarkMode 
                    ? 'bg-zinc-800/95 text-white border border-zinc-700/80' 
                    : 'bg-white/95 text-zinc-900 border border-zinc-200'
                }`}>
                  <span>{toastMessage}</span>
                </div>
              </div>
            )}

            {/* TAB 1: DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between pt-1">
                  <div>
                    <h2 className={`text-2xl font-bold tracking-tight ${isDarkMode ? 'text-white' : 'text-zinc-900'}`}>
                      Cash Flow
                    </h2>
                    <p className="text-xs text-zinc-400">Scheduled Outflow & Offset Timing</p>
                  </div>
                  <button
                    onClick={openAddBillModal}
                    className="h-10 w-10 rounded-full bg-blue-600 hover:bg-blue-500 text-white flex items-center justify-center shadow-lg shadow-blue-500/25 active:scale-95 transition-all"
                    aria-label="Add new bill"
                  >
                    <Icon name="plus" className="h-5 w-5 stroke-[2.5]" />
                  </button>
                </div>

                {/* Horizontal Property Carousel */}
                <div className="relative -mx-4 px-4">
                  <div 
                    className="flex items-center gap-2.5 overflow-x-auto py-1.5 px-0.5 scrollbar-none snap-x"
                    style={{
                      WebkitMaskImage: 'linear-gradient(to right, transparent, black 14px, black calc(100% - 14px), transparent)',
                      maskImage: 'linear-gradient(to right, transparent, black 14px, black calc(100% - 14px), transparent)'
                    }}
                  >
                    <button
                      onClick={() => setSelectedPropertyFilter('ALL')}
                      className={`group relative snap-start flex-shrink-0 flex items-center gap-2.5 pl-2.5 pr-3.5 py-2 rounded-2xl transition-all duration-300 active:scale-95 text-left border ${
                        selectedPropertyFilter === 'ALL'
                          ? isDarkMode
                            ? 'bg-gradient-to-b from-blue-600 to-blue-700 text-white border-blue-400/30 shadow-[0_4px_16px_rgba(37,99,235,0.35)] ring-1 ring-white/20'
                            : 'bg-gradient-to-b from-blue-600 to-blue-700 text-white border-blue-500/40 shadow-[0_4px_14px_rgba(37,99,235,0.25)] ring-1 ring-white/30'
                          : isDarkMode
                            ? 'bg-[#1C1C1E]/80 hover:bg-[#252528] text-zinc-300 border-white/5 backdrop-blur-md'
                            : 'bg-white/80 hover:bg-white text-zinc-700 border-black/5 backdrop-blur-md shadow-xs'
                      }`}
                    >
                      <div className={`h-8 w-8 rounded-xl flex items-center justify-center transition-transform group-hover:scale-105 ${
                        selectedPropertyFilter === 'ALL'
                          ? 'bg-white/20 text-white backdrop-blur-sm'
                          : isDarkMode ? 'bg-zinc-800 text-blue-400' : 'bg-blue-50 text-blue-600'
                      }`}>
                        <Icon name="layers" className="h-4 w-4" />
                      </div>
                      <div className="leading-tight">
                        <span className="text-xs font-semibold block tracking-tight">All Properties</span>
                        <div className="flex items-center gap-1.5 mt-0.5">
                          <span className={`inline-block h-1.5 w-1.5 rounded-full ${
                            metrics.overdueCount > 0 
                              ? 'bg-red-400 animate-pulse' 
                              : metrics.totalPending > 0 ? 'bg-amber-400' : 'bg-emerald-400'
                          }`} />
                          <span className={`text-[10px] font-mono ${
                            selectedPropertyFilter === 'ALL' ? 'text-blue-100' : 'text-zinc-400'
                          }`}>
                            {fmt(metrics.totalPending)}
                          </span>
                        </div>
                      </div>
                    </button>

                    {propertyOutflow.map(p => {
                      const isSelected = selectedPropertyFilter === p.id;
                      const hasPending = p.pendingCount > 0;

                      return (
                        <button
                          key={p.id}
                          onClick={() => setSelectedPropertyFilter(p.id)}
                          className={`group relative snap-start flex-shrink-0 flex items-center gap-2.5 pl-2.5 pr-3.5 py-2 rounded-2xl transition-all duration-300 active:scale-95 text-left border ${
                            isSelected
                              ? isDarkMode
                                ? 'bg-gradient-to-b from-[#2A2B30] to-[#1E1F24] text-white border-blue-500/50 shadow-lg ring-1.5 ring-blue-500'
                                : 'bg-white text-zinc-900 border-blue-500/40 shadow-md ring-1.5 ring-blue-600'
                              : isDarkMode
                                ? 'bg-[#1C1C1E]/80 hover:bg-[#252528] text-zinc-300 border-white/5 backdrop-blur-md'
                                : 'bg-white/80 hover:bg-white text-zinc-700 border-black/5 backdrop-blur-md shadow-xs'
                          }`}
                        >
                          <div className={`h-8 w-8 rounded-xl flex items-center justify-center transition-transform group-hover:scale-105 relative ${
                            isSelected
                              ? 'bg-blue-600 text-white shadow-sm'
                              : isDarkMode ? 'bg-zinc-800 text-zinc-300' : 'bg-zinc-100 text-zinc-600'
                          }`}>
                            <Icon name={p.type === 'Home' ? 'home' : 'building-2'} className="h-4 w-4" />
                            <span className={`absolute -top-0.5 -right-0.5 h-2 w-2 rounded-full ring-2 ${
                              isDarkMode ? 'ring-[#1C1C1E]' : 'ring-white'
                            } ${
                              p.hasOverdue 
                                ? 'bg-red-500' 
                                : hasPending ? 'bg-amber-400' : 'bg-emerald-400'
                            }`} />
                          </div>

                          <div className="leading-tight">
                            <span className="text-xs font-semibold block tracking-tight">
                              {p.name}
                            </span>
                            <div className="flex items-center gap-1.5 mt-0.5 text-[10px]">
                              {hasPending ? (
                                <span className={`font-mono font-medium ${
                                  p.hasOverdue ? 'text-red-400' : isSelected ? 'text-amber-400' : 'text-zinc-400'
                                }`}>
                                  {p.pendingCount} due · {fmt(p.pending)}
                                </span>
                              ) : (
                                <span className="text-emerald-500 font-medium">All clear ✓</span>
                              )}
                            </div>
                          </div>
                        </button>
                      );
                    })}

                    <button
                      onClick={openAddPropertyModal}
                      className={`snap-start flex-shrink-0 h-[46px] px-3 rounded-2xl flex items-center justify-center gap-1.5 text-xs font-medium border border-dashed transition-all active:scale-95 ${
                        isDarkMode
                          ? 'border-zinc-700/80 hover:border-zinc-500 bg-zinc-900/40 text-zinc-400 hover:text-white'
                          : 'border-zinc-300 hover:border-zinc-400 bg-zinc-100/60 text-zinc-600 hover:text-black'
                      }`}
                    >
                      <Icon name="plus" className="h-3.5 w-3.5" />
                      <span className="text-[11px] font-semibold pr-0.5">Add</span>
                    </button>
                  </div>
                </div>

                {/* Active Selected Property Inspector */}
                {activePropertyData && (
                  <div className={`p-3.5 rounded-3xl border transition-all duration-300 ${
                    isDarkMode 
                      ? 'bg-gradient-to-br from-[#1C1C1E] via-[#1A1A1E] to-[#16161A] border-zinc-800/90 shadow-lg' 
                      : 'bg-gradient-to-br from-white via-zinc-50 to-blue-50/20 border-zinc-200/90 shadow-md'
                  }`}>
                    <div className="flex items-center justify-between">
                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider ${
                        activePropertyData.type === 'Home'
                          ? 'bg-blue-500/15 text-blue-400 border border-blue-500/20'
                          : 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/20'
                      }`}>
                        {activePropertyData.type === 'Home' ? 'Primary Residence' : 'Rental Investment'}
                      </span>

                      <button
                        onClick={() => setSelectedPropertyFilter('ALL')}
                        className="text-[11px] font-medium text-blue-500 hover:underline flex items-center gap-0.5"
                      >
                        Reset <Icon name="x" className="h-3 w-3" />
                      </button>
                    </div>

                    <div className="mt-2.5 grid grid-cols-2 gap-2 text-xs">
                      <div className={`p-2.5 rounded-2xl ${isDarkMode ? 'bg-zinc-900/80' : 'bg-white border border-zinc-100'}`}>
                        <span className="text-[10px] uppercase font-semibold text-zinc-400 block">Pending Float</span>
                        <span className={`text-base font-bold font-mono ${isDarkMode ? 'text-white' : 'text-zinc-900'}`}>
                          {fmt(activePropertyData.pending)}
                        </span>
                        <span className="text-[10px] text-zinc-500 block">
                          {activePropertyData.pendingCount} unpaid bills
                        </span>
                      </div>

                      <div className={`p-2.5 rounded-2xl ${isDarkMode ? 'bg-zinc-900/80' : 'bg-white border border-zinc-100'}`}>
                        <span className="text-[10px] uppercase font-semibold text-zinc-400 block">Optimal Pay Day</span>
                        {activePropertyData.nextDueBill ? (
                          <>
                            <span className="text-base font-bold font-mono text-emerald-400 block">
                              {getOptimalPayDate(activePropertyData.nextDueBill.dueDate)}
                            </span>
                            <span className="text-[10px] text-zinc-400 truncate block">
                              For {activePropertyData.nextDueBill.name}
                            </span>
                          </>
                        ) : (
                          <>
                            <span className="text-base font-bold text-emerald-500 block">All Settled</span>
                            <span className="text-[10px] text-zinc-500 block">Zero liabilities</span>
                          </>
                        )}
                      </div>
                    </div>

                    {activePropertyData.nextDueBill?.sourceRef && (
                      <div className="mt-2.5 flex items-center justify-between text-[11px] bg-blue-500/10 border border-blue-500/20 px-3 py-2 rounded-2xl">
                        <div className="flex items-center gap-1.5 truncate mr-2">
                          <Icon name="search" className="h-3 w-3 text-blue-400 flex-shrink-0" />
                          <span className="text-zinc-300 truncate">
                            Key: <span className="font-mono text-blue-300 font-medium">{activePropertyData.nextDueBill.sourceRef}</span>
                          </span>
                        </div>
                        <button
                          onClick={() => copyToClipboard(activePropertyData.nextDueBill.sourceRef)}
                          className="text-[10px] font-semibold text-blue-400 hover:text-blue-300 flex items-center gap-1 flex-shrink-0 px-2 py-0.5 rounded-lg bg-blue-500/15"
                        >
                          <Icon name="copy" className="h-2.5 w-2.5" /> Copy
                        </button>
                      </div>
                    )}
                  </div>
                )}

                {/* Overdue Warning */}
                {metrics.overdueCount > 0 && (
                  <div className="rounded-2xl p-3.5 bg-gradient-to-r from-red-500/20 via-rose-500/10 to-transparent border border-red-500/30 backdrop-blur flex items-start gap-3">
                    <div className="p-2 rounded-xl bg-red-500/20 text-red-400">
                      <Icon name="alert-triangle" className="h-5 w-5" />
                    </div>
                    <div className="flex-1">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-bold text-red-400 uppercase tracking-wider">Payment Overdue</span>
                        <span className="text-xs font-mono font-bold text-red-400">{fmt(metrics.overdueTotal)}</span>
                      </div>
                      <p className={`text-xs mt-0.5 ${isDarkMode ? 'text-zinc-300' : 'text-zinc-700'}`}>
                        {metrics.overdueCount} {metrics.overdueCount === 1 ? 'bill is' : 'bills are'} past due. Settle promptly to prevent interest penalties.
                      </p>
                    </div>
                  </div>
                )}

                {/* 2x2 Widget Grid */}
                <div className="grid grid-cols-2 gap-3">
                  <div className={`p-3.5 rounded-3xl border flex flex-col justify-between ${
                    isDarkMode ? 'bg-[#1C1C1E] border-zinc-800' : 'bg-white border-zinc-200/80 shadow-sm'
                  }`}>
                    <div className="flex items-center justify-between">
                      <span className="h-8 w-8 rounded-2xl bg-amber-500/20 text-amber-500 flex items-center justify-center">
                        <Icon name="clock" className="h-4 w-4 stroke-[2.5]" />
                      </span>
                      <span className="text-[10px] font-semibold uppercase tracking-wider text-amber-500">Next 7 Days</span>
                    </div>
                    <div className="mt-3">
                      <span className="text-xs text-zinc-400 block font-medium">Float Needed</span>
                      <span className={`text-xl font-bold tracking-tight block ${isDarkMode ? 'text-white' : 'text-zinc-900'}`}>
                        {fmt(metrics.due7DaysTotal)}
                      </span>
                      <span className="text-[10px] text-zinc-500 mt-0.5 block">{metrics.due7DaysCount} upcoming bills</span>
                    </div>
                  </div>

                  <div className={`p-3.5 rounded-3xl border flex flex-col justify-between ${
                    isDarkMode ? 'bg-[#1C1C1E] border-zinc-800' : 'bg-white border-zinc-200/80 shadow-sm'
                  }`}>
                    <div className="flex items-center justify-between">
                      <span className="h-8 w-8 rounded-2xl bg-blue-500/20 text-blue-500 flex items-center justify-center">
                        <Icon name="dollar-sign" className="h-4 w-4 stroke-[2.5]" />
                      </span>
                      <span className="text-[10px] font-semibold uppercase tracking-wider text-blue-500">Total Pending</span>
                    </div>
                    <div className="mt-3">
                      <span className="text-xs text-zinc-400 block font-medium">Keep in Offset</span>
                      <span className={`text-xl font-bold tracking-tight block ${isDarkMode ? 'text-white' : 'text-zinc-900'}`}>
                        {fmt(metrics.totalPending)}
                      </span>
                      <span className="text-[10px] text-zinc-500 mt-0.5 block">Scheduled liabilities</span>
                    </div>
                  </div>

                  <div className={`p-3.5 rounded-3xl border flex flex-col justify-between ${
                    isDarkMode ? 'bg-[#1C1C1E] border-zinc-800' : 'bg-white border-zinc-200/80 shadow-sm'
                  }`}>
                    <div className="flex items-center justify-between">
                      <span className="h-8 w-8 rounded-2xl bg-emerald-500/20 text-emerald-500 flex items-center justify-center">
                        <Icon name="check-circle-2" className="h-4 w-4 stroke-[2.5]" />
                      </span>
                      <span className="text-[10px] font-semibold uppercase tracking-wider text-emerald-500">Paid / Cleared</span>
                    </div>
                    <div className="mt-3">
                      <span className="text-xs text-zinc-400 block font-medium">This Month</span>
                      <span className={`text-xl font-bold tracking-tight block ${isDarkMode ? 'text-white' : 'text-zinc-900'}`}>
                        {fmt(metrics.paidThisMonth)}
                      </span>
                      <span className="text-[10px] text-zinc-500 mt-0.5 block">Disbursed payments</span>
                    </div>
                  </div>

                  <div className={`p-3.5 rounded-3xl border flex flex-col justify-between ${
                    isDarkMode ? 'bg-[#1C1C1E] border-zinc-800' : 'bg-white border-zinc-200/80 shadow-sm'
                  }`}>
                    <div className="flex items-center justify-between">
                      <span className="h-8 w-8 rounded-2xl bg-purple-500/20 text-purple-400 flex items-center justify-center">
                        <Icon name="sparkles" className="h-4 w-4" />
                      </span>
                      <span className="text-[10px] font-semibold uppercase tracking-wider text-purple-400">Pay Timing</span>
                    </div>
                    <div className="mt-2">
                      <span className="text-xs font-semibold text-purple-300 block">T-2 Day Rule</span>
                      <p className="text-[10px] text-zinc-400 leading-snug mt-1">
                        Paying 2 days before due keeps maximum cash compounding in your offset.
                      </p>
                    </div>
                  </div>
                </div>

                {/* Priority Next Actions */}
                <div className="pt-2">
                  <div className="flex items-center justify-between mb-2 px-1">
                    <span className="text-xs font-semibold uppercase tracking-wider text-zinc-400">Priority Next Actions</span>
                    <button 
                      onClick={() => setActiveTab('all')}
                      className="text-xs text-blue-500 font-medium flex items-center gap-0.5"
                    >
                      See All ({filteredBills.length}) <Icon name="chevron-right" className="h-3 w-3" />
                    </button>
                  </div>

                  <div className={`rounded-3xl border overflow-hidden ${
                    isDarkMode ? 'bg-[#1C1C1E] border-zinc-800' : 'bg-white border-zinc-200/80 shadow-sm'
                  }`}>
                    {filteredBills.length === 0 ? (
                      <div className="p-8 text-center flex flex-col items-center justify-center">
                        <div className="h-12 w-12 rounded-2xl bg-blue-500/10 text-blue-400 flex items-center justify-center mb-2.5">
                          <Icon name="receipt" className="h-6 w-6 stroke-[1.8]" />
                        </div>
                        <h4 className={`text-sm font-bold ${isDarkMode ? 'text-white' : 'text-zinc-900'}`}>No Active Bills</h4>
                        <p className="text-xs text-zinc-400 mt-1 max-w-[240px]">
                          Your ledger is empty. Tap below to enter bills as they arrive in your inbox.
                        </p>
                        <button
                          onClick={openAddBillModal}
                          className="mt-3.5 px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs active:scale-95 transition-all flex items-center gap-1.5 shadow-md shadow-blue-500/25"
                        >
                          <Icon name="plus" className="h-3.5 w-3.5" />
                          <span>Add Your First Bill</span>
                        </button>
                      </div>
                    ) : (
                      filteredBills.slice(0, 5).map((bill, index) => {
                        const prop = properties.find(p => p.id === bill.propertyId);
                        const cat = getCategoryDetails(bill.category);
                        const isPaid = bill.status === 'Paid';
                        const isOverdue = !isPaid && bill.daysLeft < 0;
                        const isDueSoon = !isPaid && bill.daysLeft >= 0 && bill.daysLeft <= 3;

                        return (
                          <div 
                            key={bill.id}
                            onClick={() => setViewingDetailBill(bill)}
                            className={`p-3.5 flex items-center justify-between gap-3 cursor-pointer transition-colors active:bg-zinc-800/40 ${
                              index !== 0 ? (isDarkMode ? 'border-t border-zinc-800/70' : 'border-t border-zinc-100') : ''
                            }`}
                          >
                            <div className="flex items-center gap-3 min-w-0">
                              <button
                                onClick={(e) => togglePaid(bill, e)}
                                className={`h-6 w-6 rounded-full border flex items-center justify-center transition-all flex-shrink-0 ${
                                  isPaid 
                                    ? 'bg-blue-600 border-blue-600 text-white' 
                                    : 'border-zinc-500 hover:border-blue-400 text-transparent'
                                }`}
                              >
                                <Icon name="check" className="h-3.5 w-3.5 stroke-[3]" />
                              </button>

                              <div className={`h-10 w-10 rounded-2xl flex items-center justify-center text-lg flex-shrink-0 ${cat.color}`}>
                                {cat.icon}
                              </div>

                              <div className="min-w-0">
                                <h4 className={`text-sm font-semibold truncate ${
                                  isPaid ? 'line-through text-zinc-500' : (isDarkMode ? 'text-white' : 'text-zinc-900')
                                }`}>
                                  {bill.name}
                                </h4>
                                <div className="flex items-center gap-1.5 text-xs text-zinc-400 mt-0.5 truncate">
                                  <span className="truncate">{prop?.name || 'Property'}</span>
                                  <span>•</span>
                                  <span className={
                                    isOverdue ? 'text-red-400 font-semibold' :
                                    isDueSoon ? 'text-amber-400 font-semibold' : 'text-zinc-400'
                                  }>
                                    {isPaid ? 'Paid' : isOverdue ? `${Math.abs(bill.daysLeft)}d Overdue` : bill.daysLeft === 0 ? 'Due Today' : `Due in ${bill.daysLeft}d`}
                                  </span>
                                </div>
                              </div>
                            </div>

                            <div className="text-right flex-shrink-0">
                              <div className={`text-sm font-bold font-mono tracking-tight ${
                                isPaid ? 'text-zinc-500' : (isDarkMode ? 'text-white' : 'text-zinc-900')
                              }`}>
                                {fmt(bill.amount)}
                              </div>
                              {!isPaid && (
                                <span className="inline-block mt-0.5 text-[9px] px-1.5 py-0.5 rounded-md bg-blue-500/10 text-blue-400 font-medium">
                                  Pay on {getOptimalPayDate(bill.dueDate)}
                                </span>
                              )}
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: TIMELINE */}
            {activeTab === 'timeline' && (
                  <div className="space-y-4">
                    <div className="pt-1">
                      <h1 className={`text-2xl font-bold tracking-tight ${isDarkMode ? 'text-white' : 'text-zinc-900'}`}>
                        Cash Timeline
                      </h1>
                      <p className="text-xs text-zinc-400">Scheduled Outflow & Optimal Pay Dates</p>
                    </div>

                    <div className="p-3.5 rounded-2xl bg-blue-600/10 border border-blue-500/20 text-xs text-blue-300">
                      <div className="flex items-center gap-1.5 font-bold mb-1">
                        <Icon name="sparkles" className="h-3.5 w-3.5 text-blue-400" />
                        <span>How Optimal Pay Dates Work</span>
                      </div>
                      Keep money in your savings or home loan offset. EquiBill recommends paying bills <strong>2 days</strong> before their real due date so transfers clear safely while keeping interest working for you.
                    </div>

                    <div className="space-y-3">
                      {filteredBills.filter(b => b.status !== 'Paid').length === 0 ? (
                        <div className={`p-8 rounded-3xl border text-center ${
                          isDarkMode ? 'bg-[#1C1C1E] border-zinc-800' : 'bg-white border-zinc-200 shadow-sm'
                        }`}>
                          <div className="h-11 w-11 rounded-2xl bg-emerald-500/15 text-emerald-400 mx-auto flex items-center justify-center mb-2">
                            <Icon name="check-circle-2" className="h-6 w-6" />
                          </div>
                          <h4 className="text-sm font-bold">No Pending Outflow</h4>
                          <p className="text-xs text-zinc-400 mt-0.5">All scheduled bills have been settled or none are due.</p>
                        </div>
                      ) : (
                        filteredBills.filter(b => b.status !== 'Paid').map((bill) => {
                          const prop = properties.find(p => p.id === bill.propertyId);
                          const cat = getCategoryDetails(bill.category);
                          const isOverdue = bill.daysLeft < 0;

                          return (
                            <div 
                              key={bill.id}
                              onClick={() => setViewingDetailBill(bill)}
                              className={`p-4 rounded-3xl border transition-all cursor-pointer ${
                                isDarkMode ? 'bg-[#1C1C1E] border-zinc-800' : 'bg-white border-zinc-200/80 shadow-sm'
                              }`}
                            >
                              <div className="flex items-start justify-between gap-2">
                                <div className="flex items-center gap-2.5">
                                  <span className={`h-8 w-8 rounded-xl flex items-center justify-center text-sm ${cat.color}`}>
                                    {cat.icon}
                                  </span>
                                  <div>
                                    <h4 className={`text-sm font-bold ${isDarkMode ? 'text-white' : 'text-zinc-900'}`}>
                                      {bill.name}
                                    </h4>
                                    <p className="text-xs text-zinc-400">{prop?.name}</p>
                                  </div>
                                </div>
                                <span className="text-base font-bold font-mono text-blue-400">
                                  {fmt(bill.amount)}
                                </span>
                              </div>

                              <div className={`mt-3.5 p-2.5 rounded-2xl flex items-center justify-between text-xs ${
                                isDarkMode ? 'bg-zinc-900/80' : 'bg-zinc-50'
                              }`}>
                                <div>
                                  <span className="text-[10px] uppercase font-semibold text-zinc-400 block">Recommended Pay</span>
                                  <span className="font-bold text-emerald-400">
                                    {getOptimalPayDate(bill.dueDate)}
                                  </span>
                                </div>

                                <div className="h-6 w-px bg-zinc-700/50" />

                                <div className="text-right">
                                  <span className="text-[10px] uppercase font-semibold text-zinc-400 block">Hard Due Date</span>
                                  <span className={`font-semibold ${isOverdue ? 'text-red-400' : 'text-zinc-300'}`}>
                                    {bill.dueDate} {isOverdue && '(Overdue!)'}
                                  </span>
                                </div>
                              </div>

                              {bill.sourceRef && (
                                <div className="mt-2.5 flex items-center justify-between text-[11px] text-zinc-400 bg-blue-500/5 px-2.5 py-1.5 rounded-xl border border-blue-500/10">
                                  <span className="truncate">Ref: {bill.sourceRef}</span>
                                  <button
                                    onClick={(e) => {
                                      e.stopPropagation();
                                      copyToClipboard(bill.sourceRef);
                                    }}
