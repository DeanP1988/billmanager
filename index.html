                                    className="text-blue-400 font-medium hover:underline flex items-center gap-1 ml-2 flex-shrink-0"
                                  >
                                    <Icon name="copy" className="h-3 w-3" /> Copy
                                  </button>
                                </div>
                              )}
                            </div>
                          );
                        })
                      )}
                    </div>
                  </div>
                )}

                {/* TAB 3: ALL BILLS */}
                {activeTab === 'all' && (
                  <div className="space-y-4">
                    <div className="pt-1 flex items-center justify-between">
                      <div>
                        <h1 className={`text-2xl font-bold tracking-tight ${isDarkMode ? 'text-white' : 'text-zinc-900'}`}>
                          All Bills
                        </h1>
                        <p className="text-xs text-zinc-400">Master Ledger & Invoices</p>
                      </div>
                      <button
                        onClick={openAddBillModal}
                        className="text-xs font-semibold px-3 py-1.5 rounded-full bg-blue-600 text-white"
                      >
                        + Add Bill
                      </button>
                    </div>

                    <div className={`flex items-center gap-2 px-3.5 py-2 rounded-2xl border ${
                      isDarkMode ? 'bg-[#1C1C1E] border-zinc-800' : 'bg-white border-zinc-200'
                    }`}>
                      <Icon name="search" className="h-4 w-4 text-zinc-400" />
                      <input
                        type="text"
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        placeholder="Search bill, BPAY, notes, or email..."
                        className="bg-transparent text-xs w-full focus:outline-none placeholder-zinc-500 text-current"
                      />
                      {searchQuery && (
                        <button onClick={() => setSearchQuery('')} className="text-zinc-400 hover:text-white">
                          <Icon name="x" className="h-3.5 w-3.5" />
                        </button>
                      )}
                    </div>

                    <div className={`p-1 rounded-2xl flex text-xs font-medium ${
                      isDarkMode ? 'bg-zinc-900' : 'bg-zinc-200'
                    }`}>
                      <button
                        onClick={() => setStatusFilter('ALL')}
                        className={`flex-1 py-1.5 rounded-xl transition-all ${
                          statusFilter === 'ALL'
                            ? (isDarkMode ? 'bg-zinc-800 text-white shadow-sm' : 'bg-white text-zinc-900 shadow-sm')
                            : 'text-zinc-400'
                        }`}
                      >
                        All ({bills.length})
                      </button>
                      <button
                        onClick={() => setStatusFilter('DUE_SOON')}
                        className={`flex-1 py-1.5 rounded-xl transition-all ${
                          statusFilter === 'DUE_SOON'
                            ? (isDarkMode ? 'bg-zinc-800 text-white shadow-sm' : 'bg-white text-zinc-900 shadow-sm')
                            : 'text-zinc-400'
                        }`}
                      >
                        Due Soon
                      </button>
                      <button
                        onClick={() => setStatusFilter('OVERDUE')}
                        className={`flex-1 py-1.5 rounded-xl transition-all ${
                          statusFilter === 'OVERDUE'
                            ? (isDarkMode ? 'bg-zinc-800 text-white shadow-sm' : 'bg-white text-zinc-900 shadow-sm')
                            : 'text-zinc-400'
                        }`}
                      >
                        Overdue
                      </button>
                      <button
                        onClick={() => setStatusFilter('PAID')}
                        className={`flex-1 py-1.5 rounded-xl transition-all ${
                          statusFilter === 'PAID'
                            ? (isDarkMode ? 'bg-zinc-800 text-white shadow-sm' : 'bg-white text-zinc-900 shadow-sm')
                            : 'text-zinc-400'
                        }`}
                      >
                        Paid
                      </button>
                    </div>

                    <div className={`rounded-3xl border overflow-hidden ${
                      isDarkMode ? 'bg-[#1C1C1E] border-zinc-800' : 'bg-white border-zinc-200/80 shadow-sm'
                    }`}>
                      {filteredBills.length === 0 ? (
                        <div className="p-8 text-center text-xs text-zinc-400 flex flex-col items-center justify-center">
                          <p>No bills in current ledger.</p>
                          <button
                            onClick={openAddBillModal}
                            className="mt-2 text-blue-400 hover:underline font-semibold"
                          >
                            + Add a bill now
                          </button>
                        </div>
                      ) : (
                        filteredBills.map((bill, idx) => {
                          const prop = properties.find(p => p.id === bill.propertyId);
                          const cat = getCategoryDetails(bill.category);
                          const isPaid = bill.status === 'Paid';

                          return (
                            <div
                              key={bill.id}
                              onClick={() => setViewingDetailBill(bill)}
                              className={`p-3.5 flex items-center justify-between gap-3 cursor-pointer active:bg-zinc-800/40 ${
                                idx !== 0 ? (isDarkMode ? 'border-t border-zinc-800/70' : 'border-t border-zinc-100') : ''
                              }`}
                            >
                              <div className="flex items-center gap-3 min-w-0">
                                <button
                                  onClick={(e) => togglePaid(bill, e)}
                                  className={`h-6 w-6 rounded-full border flex items-center justify-center transition-all flex-shrink-0 ${
                                    isPaid 
                                      ? 'bg-blue-600 border-blue-600 text-white' 
                                      : 'border-zinc-500 hover:border-blue-400 text-transparent'
                                  }`}
                                >
                                  <Icon name="check" className="h-3.5 w-3.5 stroke-[3]" />
                                </button>

                                <div className={`h-9 w-9 rounded-2xl flex items-center justify-center text-base flex-shrink-0 ${cat.color}`}>
                                  {cat.icon}
                                </div>

                                <div className="min-w-0">
                                  <h4 className={`text-xs font-bold truncate ${
                                    isPaid ? 'line-through text-zinc-500' : (isDarkMode ? 'text-white' : 'text-zinc-900')
                                  }`}>
                                    {bill.name}
                                  </h4>
                                  <p className="text-[11px] text-zinc-400 truncate">
                                    {prop?.name} • Due: {bill.dueDate}
                                  </p>
                                </div>
                              </div>

                              <div className="text-right flex-shrink-0">
                                <div className={`text-xs font-bold font-mono ${
                                  isPaid ? 'text-zinc-500' : (isDarkMode ? 'text-white' : 'text-zinc-900')
                                }`}>
                                  {fmt(bill.amount)}
                                </div>
                                <span className="text-[10px] text-zinc-400">
                                  {bill.category}
                                </span>
                              </div>
                            </div>
                          );
                        })
                      )}
                    </div>
                  </div>
                )}

                {/* TAB 4: PROPERTIES */}
                {activeTab === 'properties' && (
                  <div className="space-y-4">
                    <div className="pt-1 flex items-center justify-between">
                      <div>
                        <h1 className={`text-2xl font-bold tracking-tight ${isDarkMode ? 'text-white' : 'text-zinc-900'}`}>
                          Properties
                        </h1>
                        <p className="text-xs text-zinc-400">Home & Rental Outflow Analysis</p>
                      </div>
                      <button
                        onClick={openAddPropertyModal}
                        className="text-xs font-semibold px-3 py-1.5 rounded-full bg-blue-600 text-white shadow-sm hover:bg-blue-500 active:scale-95 transition-all flex items-center gap-1"
                      >
                        <Icon name="plus" className="h-3.5 w-3.5" />
                        <span>Add</span>
                      </button>
                    </div>

                    <div className="space-y-3">
                      {propertyOutflow.map(prop => (
                        <div 
                          key={prop.id}
                          className={`p-4 rounded-3xl border transition-all ${
                            isDarkMode ? 'bg-[#1C1C1E] border-zinc-800' : 'bg-white border-zinc-200/80 shadow-sm'
                          }`}
                        >
                          <div className="flex items-start justify-between gap-2">
                            <div className="flex items-center gap-3 min-w-0">
                              <div className={`h-11 w-11 rounded-2xl bg-gradient-to-tr ${prop.color || 'from-blue-500 to-indigo-600'} text-white flex items-center justify-center font-bold shadow-sm flex-shrink-0`}>
                                <Icon name={prop.type === 'Home' ? 'home' : 'building-2'} className="h-5 w-5" />
                              </div>
                              <div className="min-w-0">
                                <div className="flex items-center gap-1.5 flex-wrap">
                                  <h3 className={`text-sm font-bold truncate ${isDarkMode ? 'text-white' : 'text-zinc-900'}`}>
                                    {prop.name}
                                  </h3>
                                  <span className={`text-[10px] px-2 py-0.5 rounded-full font-semibold ${
                                    prop.type === 'Home' 
                                      ? 'bg-blue-500/15 text-blue-400' 
                                      : 'bg-emerald-500/15 text-emerald-400'
                                  }`}>
                                    {prop.type}
                                  </span>
                                </div>
                                <p className="text-[11px] text-zinc-400 truncate mt-0.5">{prop.address || 'No street address specified'}</p>
                              </div>
                            </div>

                            <div className="flex items-center gap-1 flex-shrink-0">
                              <button
                                onClick={(e) => openEditPropertyModal(prop, e)}
                                className={`p-2 rounded-xl transition-all active:scale-90 ${
                                  isDarkMode 
                                    ? 'bg-zinc-800/80 hover:bg-zinc-700 text-zinc-300 hover:text-white' 
                                    : 'bg-zinc-100 hover:bg-zinc-200 text-zinc-600 hover:text-black'
                                }`}
                                title="Edit Property"
                              >
                                <Icon name="edit-3" className="h-3.5 w-3.5" />
                              </button>
                              <button
                                onClick={(e) => promptDeleteProperty(prop, e)}
                                className="p-2 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 active:scale-90 transition-all"
                                title="Delete Property"
                              >
                                <Icon name="trash-2" className="h-3.5 w-3.5" />
                              </button>
                            </div>
                          </div>

                          <div className={`mt-3.5 p-3 rounded-2xl grid grid-cols-2 gap-2 text-xs ${
                            isDarkMode ? 'bg-zinc-900/90' : 'bg-zinc-50'
                          }`}>
                            <div>
                              <span className="text-[10px] uppercase font-semibold text-amber-500 block">Pending Float</span>
                              <span className={`font-bold font-mono ${isDarkMode ? 'text-white' : 'text-zinc-900'}`}>
                                {fmt(prop.pending)}
                              </span>
                            </div>
                            <div>
                              <span className="text-[10px] uppercase font-semibold text-emerald-500 block">Paid Disbursed</span>
                              <span className={`font-bold font-mono ${isDarkMode ? 'text-white' : 'text-zinc-900'}`}>
                                {fmt(prop.paid)}
                              </span>
                            </div>
                          </div>

                          <div className="mt-3 flex items-center justify-between text-xs text-zinc-400 pt-2 border-t border-zinc-800/40">
                            <span className="font-medium">{prop.count} Tracked {prop.count === 1 ? 'Bill' : 'Bills'}</span>
                            <button
                              onClick={() => {
                                setSelectedPropertyFilter(prop.id);
                                setActiveTab('all');
                              }}
                              className="text-blue-400 font-semibold hover:underline flex items-center gap-1"
                            >
                              View Bills <Icon name="chevron-right" className="h-3 w-3" />
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

              {/* iOS Bottom Navigation Bar (Glassmorphic) */}
              <nav className={`fixed bottom-0 left-0 right-0 z-30 px-6 pt-3 safe-bottom flex items-center justify-between backdrop-blur-2xl border-t ${
                isDarkMode 
                  ? 'bg-[#1C1C1E]/85 border-zinc-800 text-zinc-400' 
                  : 'bg-white/85 border-zinc-200 text-zinc-500'
              }`}>
                <div className="w-full max-w-lg mx-auto flex items-center justify-between">
                  <button
                    onClick={() => setActiveTab('dashboard')}
                    className={`flex flex-col items-center gap-1 text-[10px] font-medium transition-all ${
                      activeTab === 'dashboard' ? 'text-blue-500' : 'hover:text-current'
                    }`}
                  >
                    <Icon name="wallet" className="h-5 w-5" />
                    <span>Dashboard</span>
                  </button>

                  <button
                    onClick={() => setActiveTab('timeline')}
                    className={`flex flex-col items-center gap-1 text-[10px] font-medium transition-all ${
                      activeTab === 'timeline' ? 'text-blue-500' : 'hover:text-current'
                    }`}
                  >
                    <Icon name="calendar" className="h-5 w-5" />
                    <span>Timeline</span>
                  </button>

                  <button
                    onClick={openAddBillModal}
                    className="h-12 w-12 -mt-5 rounded-full bg-blue-600 text-white flex items-center justify-center shadow-lg shadow-blue-500/40 active:scale-95 transition-all"
                    aria-label="New Bill"
                  >
                    <Icon name="plus" className="h-6 w-6 stroke-[2.5]" />
                  </button>

                  <button
                    onClick={() => setActiveTab('all')}
                    className={`flex flex-col items-center gap-1 text-[10px] font-medium transition-all ${
                      activeTab === 'all' ? 'text-blue-500' : 'hover:text-current'
                    }`}
                  >
                    <Icon name="layers" className="h-5 w-5" />
                    <span>All Bills</span>
                  </button>

                  <button
                    onClick={() => setActiveTab('properties')}
                    className={`flex flex-col items-center gap-1 text-[10px] font-medium transition-all ${
                      activeTab === 'properties' ? 'text-blue-500' : 'hover:text-current'
                    }`}
                  >
                    <Icon name="building-2" className="h-5 w-5" />
                    <span>Properties</span>
                  </button>
                </div>
              </nav>

            {/* MODAL: Bill Details Sheet */}
            {viewingDetailBill && (
              <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end justify-center transition-all">
                <div className={`w-full max-w-lg rounded-t-[36px] p-6 max-h-[85%] overflow-y-auto border-t shadow-2xl animate-in slide-in-from-bottom duration-300 ${
                  isDarkMode ? 'bg-[#1C1C1E] border-zinc-700 text-white' : 'bg-white border-zinc-200 text-zinc-900'
                }`}>
                  <div className="w-10 h-1 bg-zinc-500/40 rounded-full mx-auto mb-4" />

                  <div className="flex items-center justify-between">
                    <span className="text-[11px] font-bold uppercase tracking-wider text-blue-500">Bill Inspection</span>
                    <button onClick={() => setViewingDetailBill(null)} className="p-1 rounded-full bg-zinc-800 text-zinc-400 hover:text-white">
                      <Icon name="x" className="h-4 w-4" />
                    </button>
                  </div>

                  <div className="mt-3">
                    <h2 className="text-xl font-bold tracking-tight">{viewingDetailBill.name}</h2>
                    <p className="text-xs text-zinc-400">
                      {properties.find(p => p.id === viewingDetailBill.propertyId)?.name}
                    </p>
                  </div>

                  <div className="my-4 p-4 rounded-3xl bg-blue-500/10 border border-blue-500/20 text-center">
                    <span className="text-xs text-zinc-400 block font-medium">Invoice Amount</span>
                    <span className="text-3xl font-extrabold font-mono text-blue-400 block mt-0.5">
                      {fmt(viewingDetailBill.amount)}
                    </span>
                    <div className="flex items-center justify-center gap-2 mt-2">
                      <span className="text-xs px-2.5 py-0.5 rounded-full bg-blue-500/20 text-blue-300 font-medium">
                        Pay on: {getOptimalPayDate(viewingDetailBill.dueDate)}
                      </span>
                      <span className="text-xs text-zinc-400">(Due {viewingDetailBill.dueDate})</span>
                    </div>
                  </div>

                  <div className="space-y-1 mb-4">
                    <span className="text-xs font-semibold text-zinc-400 flex items-center gap-1">
                      <Icon name="search" className="h-3 w-3 text-blue-400" /> Buried Email Search Key:
                    </span>
                    <div className={`p-3 rounded-2xl flex items-center justify-between border ${
                      isDarkMode ? 'bg-zinc-900 border-zinc-800' : 'bg-zinc-100 border-zinc-200'
                    }`}>
                      <span className="text-xs font-mono text-blue-400 truncate mr-2">
                        {viewingDetailBill.sourceRef || 'No email reference set'}
                      </span>
                      <button
                        onClick={() => copyToClipboard(viewingDetailBill.sourceRef || viewingDetailBill.name)}
                        className="px-2.5 py-1 rounded-xl bg-blue-600 text-white text-xs font-semibold flex items-center gap-1 flex-shrink-0"
                      >
                        <Icon name="copy" className="h-3 w-3" /> Copy
                      </button>
                    </div>
                  </div>

                  {viewingDetailBill.bpayCode && (
                    <div className="space-y-1 mb-4">
                      <span className="text-xs font-semibold text-zinc-400 flex items-center gap-1">
                        <Icon name="credit-card" className="h-3 w-3 text-emerald-400" /> Payment & BPAY Details:
                      </span>
                      <div className={`p-3 rounded-2xl border text-xs font-mono ${
                        isDarkMode ? 'bg-zinc-900 border-zinc-800 text-zinc-300' : 'bg-zinc-100 border-zinc-200 text-zinc-700'
                      }`}>
                        {viewingDetailBill.bpayCode}
                      </div>
                    </div>
                  )}

                  {viewingDetailBill.notes && (
                    <div className="space-y-1 mb-5">
                      <span className="text-xs font-semibold text-zinc-400">Instructions & Notes:</span>
                      <p className={`p-3 rounded-2xl border text-xs ${
                        isDarkMode ? 'bg-zinc-900 border-zinc-800 text-zinc-300' : 'bg-zinc-100 border-zinc-200 text-zinc-700'
                      }`}>
                        {viewingDetailBill.notes}
                      </p>
                    </div>
                  )}

                  <div className="space-y-2">
                    <button
                      onClick={() => togglePaid(viewingDetailBill)}
                      className={`w-full py-3 rounded-2xl font-bold text-xs flex items-center justify-center gap-2 transition-all ${
                        viewingDetailBill.status === 'Paid'
                          ? 'bg-zinc-700 text-white'
                          : 'bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-500/30'
                      }`}
                    >
                      <Icon name="check-circle-2" className="h-4 w-4" />
                      {viewingDetailBill.status === 'Paid' ? 'Mark as Unpaid' : 'Mark Bill as Paid'}
                    </button>

                    <div className="flex gap-2">
                      <button
                        onClick={() => openEditBillModal(viewingDetailBill)}
                        className="flex-1 py-2.5 rounded-2xl bg-zinc-800 text-zinc-300 hover:text-white text-xs font-semibold"
                      >
                        Edit Details
                      </button>
                      <button
                        onClick={() => deleteBill(viewingDetailBill.id)}
                        className="flex-1 py-2.5 rounded-2xl bg-red-500/20 text-red-400 hover:bg-red-500/30 text-xs font-semibold"
                      >
                        Delete
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* MODAL: Add / Edit Bill */}
            {isAddBillOpen && (
              <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end justify-center transition-all">
                <div className={`w-full max-w-lg rounded-t-[36px] p-6 max-h-[90%] overflow-y-auto border-t shadow-2xl animate-in slide-in-from-bottom duration-300 ${
                  isDarkMode ? 'bg-[#1C1C1E] border-zinc-700 text-white' : 'bg-white border-zinc-200 text-zinc-900'
                }`}>
                  <div className="w-10 h-1 bg-zinc-500/40 rounded-full mx-auto mb-4" />

                  <div className="flex items-center justify-between pb-2 border-b border-zinc-800">
                    <h3 className="text-base font-bold">{editingBill ? 'Edit Bill' : 'Schedule New Bill'}</h3>
                    <button onClick={() => setIsAddBillOpen(false)} className="p-1 rounded-full bg-zinc-800 text-zinc-400 hover:text-white">
                      <Icon name="x" className="h-4 w-4" />
                    </button>
                  </div>

                  <form onSubmit={handleSaveBill} className="mt-4 space-y-3.5 text-xs">
                    <div>
                      <label className="block text-zinc-400 font-medium mb-1">Bill Name / Provider *</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. Sydney Water, Council Rates"
                        value={billForm.name}
                        onChange={(e) => setBillForm({ ...billForm, name: e.target.value })}
                        className={`w-full rounded-xl px-3 py-2.5 border focus:outline-none focus:border-blue-500 ${
                          isDarkMode ? 'bg-zinc-900 border-zinc-800 text-white' : 'bg-zinc-50 border-zinc-200 text-zinc-900'
                        }`}
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-2.5">
                      <div>
                        <label className="block text-zinc-400 font-medium mb-1">Property</label>
                        <select
                          value={billForm.propertyId}
                          onChange={(e) => setBillForm({ ...billForm, propertyId: e.target.value })}
                          className={`w-full rounded-xl px-2.5 py-2.5 border focus:outline-none focus:border-blue-500 ${
                            isDarkMode ? 'bg-zinc-900 border-zinc-800 text-white' : 'bg-zinc-50 border-zinc-200 text-zinc-900'
                          }`}
                        >
                          {properties.map(p => (
                            <option key={p.id} value={p.id}>{p.name}</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="block text-zinc-400 font-medium mb-1">Category</label>
                        <select
                          value={billForm.category}
                          onChange={(e) => setBillForm({ ...billForm, category: e.target.value })}
                          className={`w-full rounded-xl px-2.5 py-2.5 border focus:outline-none focus:border-blue-500 ${
                            isDarkMode ? 'bg-zinc-900 border-zinc-800 text-white' : 'bg-zinc-50 border-zinc-200 text-zinc-900'
                          }`}
                        >
                          {CATEGORIES.map(c => (
                            <option key={c.name} value={c.name}>{c.icon} {c.name}</option>
                          ))}
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2.5">
                      <div>
                        <label className="block text-zinc-400 font-medium mb-1">Amount ($) *</label>
                        <input
                          type="number"
                          step="0.01"
                          required
                          placeholder="0.00"
                          value={billForm.amount}
                          onChange={(e) => setBillForm({ ...billForm, amount: e.target.value })}
                          className={`w-full rounded-xl px-3 py-2.5 border focus:outline-none focus:border-blue-500 font-mono ${
                            isDarkMode ? 'bg-zinc-900 border-zinc-800 text-white' : 'bg-zinc-50 border-zinc-200 text-zinc-900'
                          }`}
                        />
                      </div>

                      <div>
                        <label className="block text-zinc-400 font-medium mb-1">Due Date *</label>
                        <input
                          type="date"
                          required
                          value={billForm.dueDate}
                          onChange={(e) => setBillForm({ ...billForm, dueDate: e.target.value })}
                          className={`w-full rounded-xl px-2.5 py-2.5 border focus:outline-none focus:border-blue-500 ${
                            isDarkMode ? 'bg-zinc-900 border-zinc-800 text-white' : 'bg-zinc-50 border-zinc-200 text-zinc-900'
                          }`}
                        />
                      </div>
                    </div>

                    {billForm.dueDate && (
                      <div className="p-2.5 rounded-2xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-between text-xs">
                        <span className="text-zinc-400 flex items-center gap-1">
                          <Icon name="sparkles" className="h-3 w-3 text-blue-400" /> Optimal Pay Day:
                        </span>
                        <strong className="text-blue-400">{getOptimalPayDate(billForm.dueDate)}</strong>
                      </div>
                    )}

                    <div>
                      <label className="block text-zinc-400 font-medium mb-1">Email Search Keyword / Ref</label>
                      <input
                        type="text"
                        placeholder="e.g. Search 'Coastal Rates Q4 Ref 9021'"
                        value={billForm.sourceRef}
                        onChange={(e) => setBillForm({ ...billForm, sourceRef: e.target.value })}
                        className={`w-full rounded-xl px-3 py-2.5 border focus:outline-none focus:border-blue-500 ${
                          isDarkMode ? 'bg-zinc-900 border-zinc-800 text-white' : 'bg-zinc-50 border-zinc-200 text-zinc-900'
                        }`}
                      />
                    </div>

                    <div>
                      <label className="block text-zinc-400 font-medium mb-1">BPAY / Payment Info</label>
                      <input
                        type="text"
                        placeholder="e.g. BPAY Biller Code 2819 Ref #884192"
                        value={billForm.bpayCode}
                        onChange={(e) => setBillForm({ ...billForm, bpayCode: e.target.value })}
                        className={`w-full rounded-xl px-3 py-2.5 border focus:outline-none focus:border-blue-500 ${
                          isDarkMode ? 'bg-zinc-900 border-zinc-800 text-white' : 'bg-zinc-50 border-zinc-200 text-zinc-900'
                        }`}
                      />
                    </div>

                    <div>
                      <label className="block text-zinc-400 font-medium mb-1">Notes / Instructions</label>
                      <input
                        type="text"
                        placeholder="e.g. Tenant pays 50%, tax deductible"
                        value={billForm.notes}
                        onChange={(e) => setBillForm({ ...billForm, notes: e.target.value })}
                        className={`w-full rounded-xl px-3 py-2.5 border focus:outline-none focus:border-blue-500 ${
                          isDarkMode ? 'bg-zinc-900 border-zinc-800 text-white' : 'bg-zinc-50 border-zinc-200 text-zinc-900'
                        }`}
                      />
                    </div>

                    <div className="pt-2 flex gap-2">
                      <button
                        type="button"
                        onClick={() => setIsAddBillOpen(false)}
                        className="flex-1 py-3 rounded-2xl bg-zinc-800 text-zinc-400 font-semibold"
                      >
                        Cancel
                      </button>
                      <button
                        type="submit"
                        className="flex-1 py-3 rounded-2xl bg-blue-600 hover:bg-blue-500 text-white font-bold shadow-lg shadow-blue-500/30"
                      >
                        {editingBill ? 'Save Changes' : 'Add to Schedule'}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL: Add / Edit Property */}
            {isAddPropOpen && (
              <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end justify-center transition-all">
                <div className={`w-full max-w-lg rounded-t-[36px] p-6 max-h-[85%] border-t shadow-2xl animate-in slide-in-from-bottom duration-300 ${
                  isDarkMode ? 'bg-[#1C1C1E] border-zinc-700 text-white' : 'bg-white border-zinc-200 text-zinc-900'
                }`}>
                  <div className="w-10 h-1 bg-zinc-500/40 rounded-full mx-auto mb-4" />

                  <div className="flex items-center justify-between pb-2 border-b border-zinc-800">
                    <h3 className="text-base font-bold">{editingProp ? 'Edit Property' : 'Add Property'}</h3>
                    <button 
                      onClick={() => {
                        setIsAddPropOpen(false);
                        setEditingProp(null);
                      }} 
                      className="p-1 rounded-full bg-zinc-800 text-zinc-400 hover:text-white"
                    >
                      <Icon name="x" className="h-4 w-4" />
                    </button>
                  </div>

                  <form onSubmit={handleSaveProperty} className="mt-4 space-y-3.5 text-xs">
                    <div>
                      <label className="block text-zinc-400 font-medium mb-1">Property Name *</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. 52 Coastal Highway, Mountain Cabin"
                        value={propForm.name}
                        onChange={(e) => setPropForm({ ...propForm, name: e.target.value })}
                        className={`w-full rounded-xl px-3 py-2.5 border focus:outline-none focus:border-blue-500 ${
                          isDarkMode ? 'bg-zinc-900 border-zinc-800 text-white' : 'bg-zinc-50 border-zinc-200 text-zinc-900'
                        }`}
                      />
                    </div>

                    <div>
                      <label className="block text-zinc-400 font-medium mb-1">Classification</label>
                      <select
                        value={propForm.type}
                        onChange={(e) => setPropForm({ ...propForm, type: e.target.value })}
                        className={`w-full rounded-xl px-2.5 py-2.5 border focus:outline-none focus:border-blue-500 ${
                          isDarkMode ? 'bg-zinc-900 border-zinc-800 text-white' : 'bg-zinc-50 border-zinc-200 text-zinc-900'
                        }`}
                      >
                        <option value="Rental">Investment / Rental Property</option>
                        <option value="Home">Primary Home / Residence</option>
                        <option value="Holiday">Holiday House / Airbnb</option>
                        <option value="Commercial">Commercial / Office</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-zinc-400 font-medium mb-1">Address</label>
                      <input
                        type="text"
                        placeholder="e.g. 18 Park Lane Unit 4"
                        value={propForm.address}
                        onChange={(e) => setPropForm({ ...propForm, address: e.target.value })}
                        className={`w-full rounded-xl px-3 py-2.5 border focus:outline-none focus:border-blue-500 ${
                          isDarkMode ? 'bg-zinc-900 border-zinc-800 text-white' : 'bg-zinc-50 border-zinc-200 text-zinc-900'
                        }`}
                      />
                    </div>

                    <div className="pt-2 flex gap-2">
                      <button
                        type="button"
                        onClick={() => {
                          setIsAddPropOpen(false);
                          setEditingProp(null);
                        }}
                        className="flex-1 py-3 rounded-2xl bg-zinc-800 text-zinc-400 font-semibold"
                      >
                        Cancel
                      </button>
                      <button
                        type="submit"
                        className="flex-1 py-3 rounded-2xl bg-blue-600 hover:bg-blue-500 text-white font-bold"
                      >
                        {editingProp ? 'Update Property' : 'Save Property'}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL: Destructive Delete Property Confirmation */}
            {propertyToDelete && (() => {
              const associatedBills = bills.filter(b => b.propertyId === propertyToDelete.id);
              const otherProperties = properties.filter(p => p.id !== propertyToDelete.id);
              const billCount = associatedBills.length;

              return (
                <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 transition-all">
                  <div className={`w-full max-w-sm rounded-t-[32px] sm:rounded-[32px] p-5 border shadow-2xl ${
                    isDarkMode ? 'bg-[#1C1C1E] border-zinc-700 text-white' : 'bg-white border-zinc-200 text-zinc-900'
                  }`}>
                    <div className="text-center">
                      <div className="h-12 w-12 rounded-full bg-red-500/15 text-red-500 mx-auto flex items-center justify-center mb-2">
                        <Icon name="alert-triangle" className="h-6 w-6 stroke-[2.2]" />
                      </div>
                      <h3 className="text-base font-bold">Delete &ldquo;{propertyToDelete.name}&rdquo;?</h3>
                      <p className="text-xs text-zinc-400 mt-1">
                        {billCount > 0 
                          ? `This property currently has ${billCount} tracked ${billCount === 1 ? 'bill' : 'bills'}. Choose how to handle them:`
                          : 'Are you sure you want to delete this property? This cannot be undone.'}
                      </p>
                    </div>

                    {billCount > 0 && otherProperties.length > 0 && (
                      <div className={`mt-3.5 p-3 rounded-2xl border text-xs ${
                        isDarkMode ? 'bg-zinc-900 border-zinc-800' : 'bg-zinc-50 border-zinc-200'
                      }`}>
                        <label className="block text-[11px] font-semibold text-zinc-400 mb-1.5">
                          Reassign {billCount} {billCount === 1 ? 'bill' : 'bills'} to:
                        </label>
                        <select
                          value={reassignTargetPropId}
                          onChange={(e) => setReassignTargetPropId(e.target.value)}
                          className={`w-full rounded-xl px-2.5 py-2 border text-xs focus:outline-none focus:border-blue-500 ${
                            isDarkMode ? 'bg-zinc-800 border-zinc-700 text-white' : 'bg-white border-zinc-300 text-zinc-900'
                          }`}
                        >
                          {otherProperties.map(p => (
                            <option key={p.id} value={p.id}>{p.name}</option>
                          ))}
                        </select>
                        <button
                          onClick={() => confirmDeleteProperty('reassign')}
                          className="w-full mt-2.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs active:scale-95 transition-all"
                        >
                          Reassign Bills & Delete Property
                        </button>
                      </div>
                    )}

                    <div className="mt-3 space-y-2">
                      <button
                        onClick={() => confirmDeleteProperty('delete_all')}
                        className="w-full py-2.5 rounded-2xl bg-red-600 hover:bg-red-500 text-white font-bold text-xs shadow-md shadow-red-500/25 active:scale-95 transition-all"
                      >
                        {billCount > 0 ? `Delete Property & Delete ${billCount} Bills` : 'Delete Property'}
                      </button>
                      <button
                        onClick={() => setPropertyToDelete(null)}
                        className="w-full py-2.5 rounded-2xl bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-semibold text-xs transition-all"
                      >
                        Cancel
                      </button>
                    </div>
                  </div>
                </div>
              );
            })()}

            {/* MODAL: Bill Notifications & Timing Sheet */}
            {isNotificationSheetOpen && (
              <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 transition-all">
                <div className={`w-full max-w-sm rounded-t-[34px] sm:rounded-[32px] p-5 border shadow-2xl ${
                  isDarkMode ? 'bg-[#1C1C1E] border-zinc-700 text-white' : 'bg-white border-zinc-200 text-zinc-900'
                }`}>
                  <div className="flex items-center justify-between pb-2 border-b border-zinc-800">
                    <span className="text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
                      <Icon name="bell-ring" className="h-4 w-4" /> Bill Due Notifications
                    </span>
                    <button onClick={() => setIsNotificationSheetOpen(false)} className="p-1 rounded-full bg-zinc-800 text-zinc-400 hover:text-white">
                      <Icon name="x" className="h-4 w-4" />
                    </button>
                  </div>

                  <div className="mt-4 space-y-3 text-xs">
                    <div className={`p-3 rounded-2xl border ${
                      notificationPermission === 'granted'
                        ? 'bg-emerald-500/10 border-emerald-500/25 text-emerald-300'
                        : 'bg-amber-500/10 border-amber-500/25 text-amber-300'
                    }`}>
                      <div className="flex items-center justify-between">
                        <span className="font-semibold">iOS Notification Permission:</span>
                        <span className="uppercase font-bold text-[10px] px-2 py-0.5 rounded-full bg-black/20">
                          {notificationPermission}
                        </span>
                      </div>
                      {notificationPermission !== 'granted' && (
                        <button
                          onClick={requestNotificationPermission}
                          className="mt-2 w-full py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs active:scale-95 transition-all"
                        >
                          Enable Notification Banners
                        </button>
                      )}
                    </div>

                    <div className={`p-3 rounded-2xl border space-y-1.5 ${
                      isDarkMode ? 'bg-zinc-900 border-zinc-800' : 'bg-zinc-50 border-zinc-200'
                    }`}>
                      <span className="text-[11px] font-bold text-zinc-400 block uppercase tracking-wider">
                        Automated Cadence Schedule
                      </span>
                      <div className="space-y-1 text-[11px]">
                        <div className="flex items-center justify-between">
                          <span>• 5 Days Out:</span>
                          <span className="text-zinc-400 font-mono">Early Warning</span>
                        </div>
                        <div className="flex items-center justify-between">
                          <span>• 3 Days Out:</span>
                          <span className="text-blue-400 font-mono">Action & Float Alert</span>
                        </div>
                        <div className="flex items-center justify-between">
                          <span>• 1 Day Out:</span>
                          <span className="text-amber-400 font-mono">Urgent Tomorrow</span>
                        </div>
                        <div className="flex items-center justify-between">
                          <span>• Daily While Overdue:</span>
                          <span className="text-red-400 font-mono">Repeats every day</span>
                        </div>
                      </div>
                    </div>

                    <div className="space-y-2 pt-1">
                      <button
                        onClick={() => checkAndDispatchDueNotifications(true)}
                        className="w-full py-2.5 rounded-2xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs active:scale-95 transition-all flex items-center justify-center gap-1.5"
                      >
                        <Icon name="refresh-cw" className="h-3.5 w-3.5" />
                        <span>Run Due Check Now</span>
                      </button>

                      <button
                        onClick={() => {
                          triggerSystemNotification(
                            "⚡ Test Alert: Sydney Water Due",
                            "Due in 3 days ($234.80) for Beachside Rental #1. Settle on optimal pay day.",
                            "test-sample"
                          );
                        }}
                        className="w-full py-2 rounded-2xl bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium text-xs transition-all flex items-center justify-center gap-1"
                      >
                        <Icon name="bell-ring" className="h-3.5 w-3.5" />
                        <span>Preview Sample iOS Banner</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* MODAL: iOS Prompt for New Version Update (Yes or No) */}
            {isUpdateModalOpen && availableUpdate && (
              <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4 transition-all">
                <div className={`w-full max-w-sm rounded-t-[34px] sm:rounded-[32px] p-6 border shadow-2xl animate-in zoom-in-95 duration-200 ${
                  isDarkMode ? 'bg-[#1C1C1E] border-zinc-700 text-white' : 'bg-white border-zinc-200 text-zinc-900'
                }`}>
                  <div className="w-10 h-1 bg-zinc-500/40 rounded-full mx-auto mb-3 sm:hidden" />

                  <div className="flex flex-col items-center text-center">
                    <div className="h-14 w-14 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-600 text-white flex items-center justify-center shadow-lg shadow-blue-500/30 mb-3 relative">
                      <Icon name="arrow-up-circle" className="h-7 w-7" />
                      <span className="absolute -top-1 -right-1 h-3.5 w-3.5 bg-emerald-400 rounded-full ring-2 ring-black" />
                    </div>

                    <span className="text-[10px] font-bold uppercase tracking-wider text-blue-400 bg-blue-500/10 px-2.5 py-0.5 rounded-full mb-1">
                      New Version Available
                    </span>

                    <h3 className="text-lg font-bold">Update Bill Manager?</h3>
                    <p className="text-xs text-zinc-400 mt-1">
                      A newer version (<strong>{availableUpdate.version}</strong>) is available from GitHub.
                    </p>
                  </div>

                  <div className={`mt-4 p-3.5 rounded-2xl border text-xs space-y-2 ${
                    isDarkMode ? 'bg-zinc-900 border-zinc-800' : 'bg-zinc-50 border-zinc-200'
                  }`}>
                    <div className="flex items-center justify-between text-[11px] text-zinc-400 border-b border-zinc-800 pb-1.5">
                      <span>Current: <strong>v{APP_VERSION}</strong></span>
                      <span className="text-emerald-400 font-bold">New: {availableUpdate.version}</span>
                    </div>

                    <div className="text-[11px] text-zinc-300 max-h-24 overflow-y-auto scrollbar-none leading-relaxed">
                      {availableUpdate.changelog}
                    </div>

                    <div className="pt-1.5 flex items-center gap-1.5 text-[10px] text-emerald-400 font-medium">
                      <Icon name="shield-check" className="h-3.5 w-3.5 flex-shrink-0" />
                      <span>Zero data loss: All your properties and bills will remain saved.</span>
                    </div>
                  </div>

                  <div className="mt-4 space-y-2">
                    <button
                      onClick={handleDeployUpdate}
                      className="w-full py-3 rounded-2xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs shadow-lg shadow-blue-500/30 active:scale-95 transition-all flex items-center justify-center gap-2"
                    >
                      <Icon name="download" className="h-4 w-4" />
                      <span>Yes, Update Now</span>
                    </button>

                    <button
                      onClick={() => setIsUpdateModalOpen(false)}
                      className="w-full py-2.5 rounded-2xl bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-semibold text-xs active:scale-95 transition-all"
                    >
                      No, Skip for Now
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* MODAL: GitHub & Update Settings Sheet */}
            {isUpdateSettingsOpen && (
              <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 transition-all">
                <div className={`w-full max-w-sm rounded-t-[34px] sm:rounded-[32px] p-5 border shadow-2xl ${
                  isDarkMode ? 'bg-[#1C1C1E] border-zinc-700 text-white' : 'bg-white border-zinc-200 text-zinc-900'
                }`}>
                  <div className="flex items-center justify-between pb-2 border-b border-zinc-800">
                    <span className="text-xs font-bold text-purple-400 uppercase tracking-wider flex items-center gap-1.5">
                      <Icon name="git-branch" className="h-4 w-4" /> App Updates & GitHub
                    </span>
                    <button onClick={() => setIsUpdateSettingsOpen(false)} className="p-1 rounded-full bg-zinc-800 text-zinc-400 hover:text-white">
                      <Icon name="x" className="h-4 w-4" />
                    </button>
                  </div>

                  <div className="mt-4 space-y-3 text-xs">
                    <div>
                      <label className="block text-zinc-400 font-medium mb-1">GitHub Repository (Owner/Repo)</label>
                      <input
                        type="text"
                        value={githubRepoConfig}
                        onChange={(e) => {
                          setGithubRepoConfig(e.target.value);
                          localStorage.setItem('ios_update_github_repo', e.target.value);
                        }}
                        placeholder="e.g. username/bill-manager"
                        className={`w-full rounded-xl px-3 py-2 border font-mono text-xs focus:outline-none focus:border-blue-500 ${
                          isDarkMode ? 'bg-zinc-900 border-zinc-800 text-white' : 'bg-zinc-50 border-zinc-200 text-zinc-900'
                        }`}
                      />
                      <span className="text-[10px] text-zinc-500 mt-1 block">
                        Checks this repository on cold app startup for latest release tags or commits.
                      </span>
                    </div>

                    <div className={`p-3 rounded-2xl border ${
                      isDarkMode ? 'bg-zinc-900 border-zinc-800' : 'bg-zinc-50 border-zinc-200'
                    }`}>
                      <div className="flex items-center justify-between">
                        <span className="text-zinc-400">Current Installed:</span>
                        <span className="font-bold font-mono text-blue-400">v{APP_VERSION}</span>
                      </div>
                      <div className="flex items-center justify-between mt-1 text-[11px]">
                        <span className="text-zinc-400">Cold Start Check:</span>
                        <span className="text-emerald-400 font-medium">Active (1x per session)</span>
                      </div>
                    </div>

                    <div className="space-y-2 pt-1">
                      <button
                        onClick={() => checkForAppUpdate(true)}
                        disabled={isCheckingUpdate}
                        className="w-full py-2.5 rounded-2xl bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-semibold text-xs active:scale-95 transition-all flex items-center justify-center gap-1.5"
                      >
                        <Icon name="refresh-cw" className={`h-3.5 w-3.5 ${isCheckingUpdate ? 'animate-spin' : ''}`} />
                        <span>{isCheckingUpdate ? 'Checking GitHub...' : 'Check for Updates Now'}</span>
                      </button>

                      <button
                        onClick={() => {
                          setAvailableUpdate({
                            version: "1.3.0",
                            currentVersion: APP_VERSION,
                            changelog: "• Automatic tax deductions export for rentals\n• Improved iOS notifications timing\n• Cash float yield projection calculator",
                            date: "Today",
                            htmlUrl: "#"
                          });
                          setIsUpdateModalOpen(true);
                        }}
                        className="w-full py-2 rounded-2xl bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium text-xs transition-all flex items-center justify-center gap-1"
                      >
                        <Icon name="eye" className="h-3.5 w-3.5" />
                        <span>Simulate Update Prompt</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
